<style>
  /* Edgewood web palette: Edgewood Red, Black, White, Dark Gold, Medium Gold, Dark Web Grey, Warm Web Grey */

  .tier.root { border-left-color: var(--red); }
  .tier h5 { margin: 0 0 8px; font-family: 'Spectral', Georgia, serif; font-size: 0.95rem; }

  .chip.root { background: var(--red); color: var(--white); }
  .chip.causal { background: var(--gold); color: var(--white); }
  .chip.prox { background: var(--black); color: var(--white); }

  .chip.none { background: var(--white); border: 1px dashed var(--grey); color: var(--grey); }
  .chip.cat { background: var(--white); border: 1px solid var(--grey); color: var(--grey); }

  .cmp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
  .cmp-grid h4 { margin: 16px 0 0; font-family: 'Spectral', Georgia, serif; font-size: 1.05rem; }

  /* Finding cards */
  .fcard { border: 1px solid var(--line); border-radius: 5px; padding: 12px 14px; margin-top: 10px; background: var(--white); }
  .fcard.locked { background: var(--warm); color: var(--grey); }
  .fcard .ft { font-size: 0.97rem; margin-bottom: 8px; }
  .fcard .row { display: flex; gap: 10px; flex-wrap: wrap; }

  select, input[type=text], input[type=number], textarea {
    font-family: inherit; font-size: 0.93rem; border: 2px solid var(--grey); border-radius: 4px; padding: 7px 9px; background: var(--white); color: var(--black); width: 100%;
  }

  .acard { border: 1px solid var(--line); border-top: 4px solid var(--red); border-radius: 5px; padding: 14px 16px; margin-top: 14px; background: var(--white); }
  .acard .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  @media (max-width: 640px) { .acard .grid2 { grid-template-columns: 1fr; } }
  .acard label.fl { font-size: 0.78rem; font-weight: 700; color: var(--grey); text-transform: uppercase; letter-spacing: .4px; display: block; margin: 8px 0 3px; }
  .smart { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  @media (max-width: 640px) { .smart { grid-template-columns: repeat(2, 1fr); } }
  .smart label { font-size: 0.85rem; display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; cursor: pointer; background: var(--warm); }
  .smart input { accent-color: var(--red); width: 16px; height: 16px; }
  .rm { background: none; border: none; color: var(--red); font-weight: 700; cursor: pointer; float: right; font-family: inherit; }

  .stat { display: inline-block; background: var(--red); color: var(--white); font-family: 'Spectral', Georgia, serif; font-size: 1.6rem; font-weight: 700; padding: 10px 26px; border-radius: 6px; margin: 8px 0; }
  .small { font-size: 0.85rem; color: var(--grey); }
  .printonly { display: none; }
  .nameline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .nameline input { max-width: 340px; }

  .resource-footer { text-align: center; padding: 1.5rem; font-size: 0.75rem; color: var(--grey); border-top: 1px solid var(--line); background: var(--white); margin: 40px -20px -60px; }
  .resource-footer a { color: var(--grey); text-decoration: underline; }

  @media print {
    body { background: #fff; font-size: 11pt; }
    .resource-header, .accent-bar, .stepper, .nav, .noprint, .resource-footer, .btn, .rm { display: none !important; }

    th { background: #000 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .chip, .chain-head, .stat { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// =====================================================================
// SHARED DATA (used by every CSA workbench case)
// =====================================================================
// ---------------------------------------------------------------------
// SAC MATRIX (RCA2 Appendix 1)
// ---------------------------------------------------------------------
const SEVERITY = [
  { key: "catastrophic", label: "Catastrophic", desc: "Death or major permanent loss of function not related to the natural course of the illness" },
  { key: "major", label: "Major", desc: "Permanent lessening of function, disfigurement, or surgical intervention required" },
  { key: "moderate", label: "Moderate", desc: "Increased length of stay or increased level of care for one or two patients" },
  { key: "minor", label: "Minor", desc: "No injury, no increased length of stay, no increased level of care" }
];
const PROBABILITY = [
  { key: "frequent", label: "Frequent", desc: "Likely to occur immediately or within a short period (several times in 1 year)" },
  { key: "occasional", label: "Occasional", desc: "Probably will occur (several times in 1 to 2 years)" },
  { key: "uncommon", label: "Uncommon", desc: "Possible to occur (sometime in 2 to 5 years)" },
  { key: "remote", label: "Remote", desc: "Unlikely to occur (sometime in 5 to 30 years)" }
];
const SAC = {
  frequent:   { catastrophic: 3, major: 3, moderate: 2, minor: 1 },
  occasional: { catastrophic: 3, major: 2, moderate: 1, minor: 1 },
  uncommon:   { catastrophic: 3, major: 2, moderate: 1, minor: 1 },
  remote:     { catastrophic: 3, major: 2, moderate: 1, minor: 1 }
};

// ---------------------------------------------------------------------
// LEVEL OF ANALYSIS
// ---------------------------------------------------------------------
const LEVELS = [
  { key: "none", label: "No CSA needed", sub: "Track and trend the event" },
  { key: "ACA", label: "Apparent Cause Analysis (ACA)", sub: "A less formal review for less significant events" },
  { key: "CCA", label: "Common Cause Analysis (CCA)", sub: "A review across several similar events" },
  { key: "RCA", label: "Root Cause Analysis (RCA)", sub: "A formal, in-depth review (RCA2)" }
];

// ---------------------------------------------------------------------
// FISHBONE: categories, types, and findings
// ---------------------------------------------------------------------
const CATS = [
  { key: "comm", label: "Communication" },
  { key: "policy", label: "Policies and Procedures" },
  { key: "culture", label: "Culture and Leadership" },
  { key: "training", label: "Training and Competency" },
  { key: "staff", label: "Staffing and Workload" },
  { key: "env", label: "Environment and Technology" }
];
// HPI Taxonomy of System Failure Mechanisms (SFM), Appendix F-2. Applies to root causes only.
const SFM = [
  { key: "P", label: "Process", items: [
    { code: "P1", label: "Omitted Actions", d: "key activity is missing or incomplete" },
    { code: "P2", label: "Excessive Actions", d: "contains low-value activities" },
    { code: "P3", label: "Poorly Sequenced", d: "poor flow, excessive branching of work process activities" },
    { code: "P4", label: "Inadequate Interface", d: "lack of or poorly designed handoffs of information, resources, or products" },
    { code: "P5", label: "Inadequate Checks", d: "lack of or poorly designed checks, inspections, or reviews" } ] },
  { key: "D", label: "Policy and Protocol", items: [
    { code: "D1", label: "Lacking or Informal", d: "no policy or protocol" },
    { code: "D2", label: "Usability", d: "poor presentation or information depiction, low credibility, poor access" },
    { code: "D3", label: "Understandability", d: "difficult to comprehend because guidance detail is lacking or inadequate for the knowledge and skill level of the user" },
    { code: "D4", label: "Knowledge in Environment", d: "inadequate or under-utilized job aids, forcing functions" } ] },
  { key: "T", label: "Technology and Environment", items: [
    { code: "T1", label: "Input / Output", d: "visual display, alarms, control configuration" },
    { code: "T2", label: "Human Capability", d: "symbols, codes, anthropometry, devices, human control, physical work" },
    { code: "T3", label: "Arrangement", d: "physical arrangement of work space, department, facility, or campus negatively impacting performance" },
    { code: "T4", label: "Environment", d: "lighting, noise, climate, motion negatively impacting performance" } ] },
  { key: "S", label: "Structure", items: [
    { code: "S1", label: "Structure Model", d: "wrong model, incompatible missions" },
    { code: "S2", label: "Inadequate Job Function", d: "overlap or gaps in roles, responsibilities, or expectations" },
    { code: "S3", label: "Resource Allocation", d: "insufficient infrastructure, people, budget, equipment, or other resources" },
    { code: "S4", label: "Collaboration Mechanisms", d: "wrong or inadequate collaboration mechanisms" },
    { code: "S5", label: "Inadequate Structure", d: "span of control, levels of leadership, leveraging positions and experience" } ] },
  { key: "C", label: "Culture", items: [
    { code: "C1", label: "Inadequate Vision or Mission", d: "lacking or poorly executed mission" },
    { code: "C2", label: "Operational Leadership", d: "lacking or inadequate command, prioritization, or assignment in response to emergent or emerging issues" },
    { code: "C3", label: "Non-Collaboration", d: "disruptive competition, defensiveness, poor teamwork, low morale" },
    { code: "C4", label: "High Reliability Environment", d: "setting does not incorporate error prevention expectations (consciousness, critical thinking, compliance, competency, communication)" } ] }
];
function sfmObj(key) { const g = SFM.find(x => x.key === key); return g ? { code: g.key, group: g.label, label: g.label, items: g.items, d: g.items.map(i => i.label + ' (' + i.d + ')').join('; ') } : null; }
const TYPES = [
  { key: "prox", label: "Proximate cause", short: "Proximate", help: "An action or happening that should not have occurred and that contributes directly to the event." },
  { key: "causal", label: "Causal factor", short: "Causal factor", help: "A condition in the work system that shapes or contributes to a proximate cause." },
  { key: "root", label: "Root cause", short: "Root cause", help: "The most significant causal factor that, if corrected, would prevent recurrence." },
  { key: "non", label: "Not causal (context)", short: "Context", help: "Information that is true and worth knowing but does not explain the event." }
];
// ---------------------------------------------------------------------
// FIVE RULES OF CAUSATION (RCA2 Appendix 6)
// ---------------------------------------------------------------------
const FIVE_RULES = [
  "Clearly shows the cause and effect relationship.",

CASE.peopleNote = "The therapist in this event will likely experience what researchers call second victim syndrome: guilt, self-doubt, and distress after harm to a patient in her care. She came to work to help this patient recover, and she worked inside a system where the supplies, the visit note, and the protocol update did not support her. A strong organizational response includes attending to her wellbeing, in addition to analyzing the system. The patient and her daughter also deserve a clear, honest account and follow-up, which fits the CANDOR approach.";
// =====================================================================
// ENGINE
// =====================================================================
const app = document.getElementById('app');
const stepperEl = document.getElementById('stepper');

const S = {
  step: 'intro',
  start: Date.now(),
  sev: null, prob: null,
  level: null, triedACA: false, levelTried: [],
  rec: new Set(), int: new Set(),
  pending: { rec: new Set(), int: new Set() },
  gapsMarked: new Set(), gapsChecked: false,
  tags: {}, chains: [], ctx: [], bphase: 'prox', pick: '', rules: {}, rulesWarned: {}, cats: {}, pickCat: '',
  stmt: { cause: '', effect: '', event: '', rules: [false, false, false, false, false] }, stmtCompared: false,
  aca: { occ: '', immediate: '', cause: '', significance: '', staffing: '', gaps: [{gap:'',action:'',owner:'',due:''},{gap:'',action:'',owner:'',due:''},{gap:'',action:'',owner:'',due:''}] }, acaCompared: false,
  actions: [], actionsChecked: false, actionSeq: 0,
  name: ''
};

const SECTIONS = [
  { label: "Harm score", steps: ["harm"] },
  { label: "Level of analysis", steps: ["level"] },
  { label: "Fact finding", steps: ["gather", "timeline", "gather2"] },
  { label: "Cause analysis", steps: ["aca", "fishbone", "check"] },
  { label: "Actions", steps: ["actions"] },
  { label: "Summary", steps: ["summary"] }
];

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function byId(list, id) { return list.find(x => x.id === id); }
function gathered(id) { return S.rec.has(id) || S.int.has(id); }
function anyGathered(ids) { return ids.some(gathered); }
function srcName(id) { const r = byId(RECORDS, id) || byId(INTERVIEWS, id); return r ? (r.title || r.role) : id; }
function typeObj(k) { return TYPES.find(t => t.key === k); }
function catObj(k) { return CATS.find(c => c.key === k); }

function renderStepper() {
  let cur = SECTIONS.findIndex(s => s.steps.indexOf(S.step) >= 0);
  if (S.step === 'intro') cur = -1;
  stepperEl.innerHTML = SECTIONS.map((s, i) => {
    const cls = i < cur ? 'done' : i === cur ? 'now' : '';
    return `<div class="st ${cls}">${i + 1}. ${s.label}</div>`;
  }).join('');
}
function go(step) {
  S.step = step;
  renderStepper();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function fb(label, body, strong) {
  return `<div class="feedback${strong ? ' strong' : ''}"><span class="lbl">${label}</span>${body}</div>`;
}
function vignetteBox() { return `<div class="vignette"><strong>The Event:</strong> ${CASE.vignette}</div>`; }
function nav(buttons) { return `<div class="nav">${buttons}</div>`; }

// ---------------------------------------------------------------------
// STEP: INTRO
// ---------------------------------------------------------------------
function renderIntro() {
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Case ${CASE.num}: ${CASE.title}</span>
    <h2 class="title">Comprehensive Safety Analysis Workbench</h2>
    <p class="lead">You are the patient safety manager. An event report has just reached your desk. In this workbench you decide how deeply to analyze it, gather the facts the way a review team would, work out the causes, and build an action plan.</p>
    ${vignetteBox()}
    <div class="box"><strong>What you will do</strong>
      <ul>
        <li>Score the level of harm with the SAC Matrix.</li>
        <li>Decide whether a Comprehensive Safety Analysis (CSA) is needed, and at what level: ACA, CCA, or RCA.</li>
        <li>Review the chart and interview staff, then build the timeline and identify gaps.</li>
        <li>Complete an ACA template, or build a cause and effect diagram and test your root causes.</li>
        <li>Write actions, rank their strength, and check them against the SMART(IES) criteria.</li>
      </ul>
    </div>
    <div class="pswp"><strong>Confidential work product.</strong> In a real review, your documents are patient safety work product. Do not include protected health information or staff names in anything you write. All records and interviews here are fictional teaching material.</div>
    <div class="pswp"><strong>Save your work before you close this page.</strong> Your responses live in your browser session only. At the end you will print or save a summary as a PDF to submit to your instructor.</div>
    ${nav(`<button class="btn" id="go">Begin</button>`)}
  </div>`;
  document.getElementById('go').onclick = () => go('harm');
}

// ---------------------------------------------------------------------
// STEP: HARM (SAC)
// ---------------------------------------------------------------------
function matrixHTML() {
  const sevs = SEVERITY.map(s => s.key);
  let rows = PROBABILITY.map(p => {
    return `<tr><td><strong>${p.label}</strong></td>` + sevs.map(sv => {
      const hot = S.prob === p.key && S.sev === sv;
      return `<td class="num${hot ? ' hot' : ''}">${SAC[p.key][sv]}</td>`;
    }).join('') + `</tr>`;
  }).join('');
  return `<div class="tbl-scroll"><table><tr><th>Probability</th>${SEVERITY.map(s => `<th>${s.label}</th>`).join('')}</tr>${rows}</table></div>`;
}
function renderHarm() {
  const sevDone = !!S.sev, probDone = !!S.prob;
  const sevOpts = SEVERITY.map(o => `<button class="opt${S.sev === o.key ? ' chosen' : ''}" data-sev="${o.key}" ${sevDone ? 'disabled' : ''}>${o.label}<small>${o.desc}</small></button>`).join('');
  const probOpts = PROBABILITY.map(o => `<button class="opt${S.prob === o.key ? ' chosen' : ''}" data-prob="${o.key}" ${probDone ? 'disabled' : ''}>${o.label}<small>${o.desc}</small></button>`).join('');
  let sevFb = '';
  if (sevDone) {
    sevFb = S.sev === CASE.harm.expectedSeverity
      ? fb(CASE.harm.sevRight[0], CASE.harm.sevRight[1], true)
      : fb(CASE.harm.sevWrong[0], CASE.harm.sevWrong[1]);
  }
  let probFb = '';
  if (probDone) {
    const pf = CASE.harm.probFb(S.prob);
    probFb = fb(pf[0], pf[1], true);
  }
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Step 1</span>
    <h2 class="title">Score the Level of Harm</h2>
    ${vignetteBox()}
    <div class="question">What is the severity of this event?</div>
    <div class="helper">Use the Safety Assessment Code (SAC) Matrix from RCA2 Appendix 1. For actual events, assign severity from the patient's actual condition.</div>
    <div class="options" id="sevOpts">${sevOpts}</div>
    ${sevFb}
    ${sevDone && S.sev !== CASE.harm.expectedSeverity ? nav(`<button class="btn alt" id="sevRetry">Try again</button>`) : ''}
    ${sevDone && S.sev === CASE.harm.expectedSeverity ? `
      <div class="question">How probable is a similar event at your organization?</div>
      <div class="helper">If you do not have tracking data, the SAC guidance suggests asking the staff most familiar with the process for an informed estimate.</div>
      <div class="options">${probOpts}</div>${probFb}` : ''}
    ${probDone ? `
      <h3 style="margin-top:22px;">SAC Matrix Result: ${SAC[S.prob][S.sev]}${CASE.harm.resultNote(SAC[S.prob][S.sev])}</h3>
      ${matrixHTML()}
      ${fb(CASE.harm.dimension[0], CASE.harm.dimension[1])}
      ${nav(`<button class="btn" id="next">Decide the Level of Analysis</button>`)}` : ''}
  </div>`;
  app.querySelectorAll('[data-sev]').forEach(b => b.onclick = () => { S.sev = b.dataset.sev; renderHarm(); });
  app.querySelectorAll('[data-prob]').forEach(b => b.onclick = () => { S.prob = b.dataset.prob; renderHarm(); });
  const retry = document.getElementById('sevRetry'); if (retry) retry.onclick = () => { S.sev = null; renderHarm(); };
  const next = document.getElementById('next'); if (next) next.onclick = () => go('level');
}

// ---------------------------------------------------------------------
// STEP: LEVEL OF ANALYSIS
// ---------------------------------------------------------------------
function levelFeedback(key) {
  const t = CASE.levelFb[key];
  return fb(t[0], t[1], !!t[2]);
}
function renderLevel() {
  const chosen = S.levelTried.length ? S.levelTried[S.levelTried.length - 1] : null;
  const opts = LEVELS.map(o => `<button class="opt${chosen === o.key ? ' chosen' : ''}" data-lv="${o.key}" ${chosen ? 'disabled' : ''}>${o.label}<small>${o.sub}</small></button>`).join('');
  let after = '';
  if (chosen) {
    after = levelFeedback(chosen);
    if (chosen === CASE.expectedLevel) after += nav(`<button class="btn" id="goGather">Begin Fact Finding</button>`);
    else if (chosen === 'ACA' && CASE.allowTryAca) after += nav(`<button class="btn alt" id="again">Reconsider the level</button><button class="btn dark" id="tryAca">Complete an ACA to compare</button>`);
    else after += nav(`<button class="btn alt" id="again">Choose again</button>`);
  }
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Step 2</span>
    <h2 class="title">Is a CSA Needed, and at What Level?</h2>
    <div class="reference-box box"><strong>Reference: the levels of analysis</strong>
      <ul>
        <li><strong>ACA:</strong> a less formal problem-solving process that asks what happened, why, and how to prevent recurrence; often used for less significant events.</li>
        <li><strong>CCA:</strong> an analysis across several similar events to find the causes they share.</li>
        <li><strong>RCA:</strong> a formal problem-solving process that provides the best recurrence control and is used for the most significant events.</li>
      </ul>
    </div>
    <div class="question">Your SAC score is ${SAC[S.prob][S.sev]}. Do you need a Comprehensive Safety Analysis, and if so, which level?</div>
    <div class="options">${opts}</div>
    ${after}
  </div>`;
  app.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { S.levelTried.push(b.dataset.lv); renderLevel(); });
  const g = document.getElementById('goGather'); if (g) g.onclick = () => { S.level = CASE.expectedLevel; go('gather'); };
  const a = document.getElementById('again'); if (a) a.onclick = () => { S.levelTried.push(null); S.levelTried = S.levelTried.filter(x => x !== null); S.levelTried.length = 0; renderLevel(); };
  const t = document.getElementById('tryAca'); if (t) t.onclick = () => { S.level = 'ACA'; S.triedACA = true; go('gather'); };
}

// ---------------------------------------------------------------------
// STEP: GATHER (chart review and interviews)
// ---------------------------------------------------------------------
const BUDGET = CASE.budget || { rec: 6, int: 4 };
function revealHTML(list, kind) {
  const items = list.filter(x => gathered(x.id));
  return items.map(x => `<div class="reveal"><div class="hd"><span>${esc(x.title || x.role)}</span><span class="tag">${esc(x.sub)}</span></div><div class="bd">${x.body}</div></div>`).join('');
}
function renderGather(round) {
  const unlimited = round === 2;
  const recList = unlimited ? RECORDS.filter(r => !S.rec.has(r.id)) : RECORDS;
  const intList = unlimited ? INTERVIEWS.filter(i => !S.int.has(i.id)) : INTERVIEWS;
  const p = S.pending;
  const recFull = !unlimited && p.rec.size >= BUDGET.rec;
  const intFull = !unlimited && p.int.size >= BUDGET.int;
  const mk = (x, kind, full, set) => {
    const checked = set.has(x.id);
    const dis = !checked && full;
    return `<label class="pick${dis ? ' disabled' : ''}"><input type="checkbox" data-kind="${kind}" data-id="${x.id}" ${checked ? 'checked' : ''} ${dis ? 'disabled' : ''}><span><span class="t">${esc(x.title || x.role)}</span><br><span class="d">${esc(x.sub)}</span></span></label>`;
  };
  const alreadyRec = !unlimited && S.rec.size > 0;
  if (alreadyRec) {
    // Round one results view
    app.innerHTML = `
    <div class="card">
      <span class="step-label">Step 3</span>
      <h2 class="title">What You Gathered</h2>
      <p class="helper">Read each source and note what it tells you and what it leaves open. Compare accounts: expect differences between what different people describe.</p>
      <h3>Chart review</h3>${revealHTML(RECORDS, 'rec') || '<p class="helper">No records selected.</p>'}
      <h3 style="margin-top:20px;">Interviews</h3>${revealHTML(INTERVIEWS, 'int') || '<p class="helper">No interviews selected.</p>'}
      ${fb('A thought before you build the timeline.', 'Some records add context without changing the sequence of events, and some interviews carry details that only one person holds. In the next step you will turn what you have into a timeline and decide which questions remain open.')}
      ${nav(`<button class="btn" id="toTl">Build the Timeline</button>`)}
    </div>`;
    document.getElementById('toTl').onclick = () => go('timeline');
    return;
  }
  app.innerHTML = `
  <div class="card">
    <span class="step-label">${unlimited ? 'Step 3: More Information' : 'Step 3'}</span>
    <h2 class="title">${unlimited ? 'Request Additional Information' : 'Chart Review and Interviews'}</h2>
    <p>${unlimited ? 'Choose any further records or interviews you want. The review team can ask for what it needs; there is no limit in this round.' : 'The review team meets soon, so you have time to pull a limited number of records and hold a limited number of interviews before your first pass. Choose the ones you think will tell you the most about what happened and why.'}</p>
    ${unlimited ? '' : `<div class="box"><strong>Interviewing tips (RCA2 Appendix 3)</strong><ul>
      <li>Interview one person at a time, and expect their accounts to differ.</li>
      <li>The guiding question is not "where did people go wrong?" but "why did their action make sense to them at the time?"</li>
      <li>Explain that the review seeks system issues and does not assign blame.</li></ul></div>`}
    <h3>Chart review ${unlimited ? '' : `<span class="counter" id="recCt">(${p.rec.size} of ${BUDGET.rec})</span>`}</h3>
    <div class="picklist" id="recList">${recList.map(x => mk(x, 'rec', recFull, p.rec)).join('') || '<p class="helper">You have reviewed every record.</p>'}</div>
    <h3 style="margin-top:22px;">Interviews ${unlimited ? '' : `<span class="counter" id="intCt">(${p.int.size} of ${BUDGET.int})</span>`}</h3>
    <div class="picklist" id="intList">${intList.map(x => mk(x, 'int', intFull, p.int)).join('') || '<p class="helper">You have held every interview.</p>'}</div>
    ${nav(`${unlimited ? `<button class="btn alt" id="back">${S.returnTo ? 'Back to the analysis' : 'Back to the timeline'}</button>` : ''}<button class="btn" id="pull" ${p.rec.size + p.int.size === 0 ? 'disabled' : ''}>${unlimited ? 'Add to My Fact Finding' : 'Review What I Selected'}</button>`)}
  </div>`;
  app.querySelectorAll('input[type=checkbox][data-id]').forEach(cb => cb.onchange = () => {
    const set = cb.dataset.kind === 'rec' ? p.rec : p.int;
    if (cb.checked) set.add(cb.dataset.id); else set.delete(cb.dataset.id);
    renderGather(round);
  });
  const pull = document.getElementById('pull');
  pull.onclick = () => {
    p.rec.forEach(id => S.rec.add(id)); p.int.forEach(id => S.int.add(id));
    p.rec.clear(); p.int.clear();
    if (unlimited) {
      app.innerHTML = `<div class="card"><span class="step-label">Step 3: More Information</span><h2 class="title">What You Added</h2>
        ${revealHTML(RECORDS.filter(r => S.rec.has(r.id)), 'rec')}${revealHTML(INTERVIEWS.filter(i => S.int.has(i.id)), 'int')}
        ${nav(`<button class="btn alt" id="more">Request more</button><button class="btn" id="toTl2">${S.returnTo ? 'Return to the Analysis' : 'Update the Timeline'}</button>`)}</div>`;
      document.getElementById('toTl2').onclick = () => { const t = S.returnTo; S.returnTo = null; go(t || 'timeline'); };
      document.getElementById('more').onclick = () => renderGather(2);
    } else { renderGather(1); }
  };
  const back = document.getElementById('back'); if (back) back.onclick = () => { const t = S.returnTo; S.returnTo = null; go(t || 'timeline'); };
}

// ---------------------------------------------------------------------
// STEP: TIMELINE AND GAPS
// ---------------------------------------------------------------------
function timelineHTML(forPrint) {
  const vis = TIMELINE.filter(e => anyGathered(e.needs));
  const rows = vis.map(e => `<div class="ev${e.gap ? ' gap' : ''}"><span class="tm">${e.t}</span> &nbsp;${e.text}</div>`).join('');
  return `<div class="tl">${rows || '<div class="ev">No timeline entries are supported yet.</div>'}</div><p class="small">${vis.length} of ${TIMELINE.length} timeline entries documented from your fact finding.</p>`;
}
function gapState(g) {
  if (g.distractor) return 'distractor';
  return anyGathered(g.resolvedBy) ? 'resolved' : 'open';
}
function renderTimeline() {
  const gapList = GAPS.map(g => `<label class="pick"><input type="checkbox" data-gap="${g.id}" ${S.gapsMarked.has(g.id) ? 'checked' : ''}><span class="t" style="font-weight:400;">${esc(g.text)}</span></label>`).join('');
  let result = '';
  if (S.gapsChecked) {
    const lines = [];
    GAPS.forEach(g => {
      const st = gapState(g), marked = S.gapsMarked.has(g.id);
      if (marked && st === 'open') lines.push(`<li><strong>Still open:</strong> ${esc(g.text)} To close it: ${esc(g.answer)}</li>`);
      else if (marked && st === 'resolved') {
        const srcs = g.resolvedBy.filter(gathered).map(srcName).join('; ');
        lines.push(`<li><strong>Your fact finding already speaks to this:</strong> ${esc(g.text)} See: ${esc(srcs)}.</li>`);
      } else if (marked && st === 'distractor') lines.push(`<li><strong>Let's test this one:</strong> ${esc(g.text)} ${esc(g.why)}</li>`);
      else if (!marked && st === 'open') lines.push(`<li><strong>Have you thought about this question?</strong> ${esc(g.text)} To close it: ${esc(g.answer)}</li>`);
    });
    const openCount = GAPS.filter(g => gapState(g) === 'open').length;
    result = fb(lines.length ? 'Here is how your gap list compares with what remains open.' : 'Your marked gaps line up with what remains open.',
      lines.length ? `<ul style="margin:6px 0 0;padding-left:20px;">${lines.join('')}</ul>` : 'Nothing further stands out from the sources you have gathered.') +
      `<p class="small">${openCount} question${openCount === 1 ? '' : 's'} about causes remain open based on what you have gathered.</p>`;
  }
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Step 4</span>
    <h2 class="title">Build the Timeline and Identify the Gaps</h2>
    <p>This sequence of events is built from the sources you gathered. Red entries mark periods with no documentation.</p>
    ${timelineHTML()}
    <div class="question" style="margin-top:22px;">Which questions about this event are still unanswered?</div>
    <div class="helper">Check the questions that you believe remain open after your fact finding. A question can be answered by a source you already pulled, so read your sources again if you are unsure.</div>
    <div class="picklist" id="gapList">${gapList}</div>
    ${nav(`<button class="btn dark" id="chk">Check My Gap List</button>`)}
    ${result}
    ${S.gapsChecked ? nav(`<button class="btn alt" id="more">Gather More Information</button><button class="btn" id="cont">${S.level === 'ACA' ? 'Continue to the ACA Template' : 'Continue to Cause Analysis'}</button>`) : ''}
  </div>`;
  app.querySelectorAll('[data-gap]').forEach(cb => cb.onchange = () => { cb.checked ? S.gapsMarked.add(cb.dataset.gap) : S.gapsMarked.delete(cb.dataset.gap); S.gapsChecked = false; renderTimelineKeepScroll(); });
  document.getElementById('chk').onclick = () => { S.gapsChecked = true; renderTimelineKeepScroll(); };
  const more = document.getElementById('more'); if (more) more.onclick = () => { S.gapsChecked = false; S.returnTo = null; go('gather2'); };
  const cont = document.getElementById('cont'); if (cont) cont.onclick = () => go(S.level === 'ACA' ? 'aca' : 'fishbone');
}
function renderTimelineKeepScroll() { const y = window.scrollY; renderTimeline(); window.scrollTo(0, y); }

// ---------------------------------------------------------------------
// STEP: ACA PATH (manager review received, then the ACA Report)
// ---------------------------------------------------------------------
function acaReady() {
  const a = S.aca;
  const g0 = a.gaps[0];
  return a.occ.trim().length >= 20 && a.immediate.trim().length >= 20 && a.cause.trim().length >= 20 &&
    a.significance.trim().length >= 20 && a.staffing.trim().length >= 5 &&
    g0.gap.trim().length >= 10 && g0.action.trim().length >= 10;
}
function renderACA() {
  const dueOpts = `<option value="">Due date</option>` + DUE_OPTIONS.map(d => `<option value="${d}">${d}</option>`).join('');
  const sig = S.aca.significance;
  let sigFb = '';
  if (S.acaCompared) {
    sigFb = CASE.acaSigFb(sig);
  }
  const mgr = MANAGER_REVIEW.map((m, i) => `<p><strong>${i + 1}. ${esc(m.q)}</strong><br>${esc(m.a)}</p>`).join('');

    <div class="question">${f.label}</div><div class="helper">${f.help}</div>
    <textarea data-aca="${f.id}" aria-label="${esc(f.label)}">${esc(S.aca[f.id])}</textarea>
    ${S.acaCompared ? `<div class="box"><strong>A model response:</strong> ${esc(ACA_MODEL[f.id])}</div>` : ''}
    ${f.id === 'significance' ? sigFb : ''}`).join('');
  const gapRows = [0, 1, 2].map(i => {
    const g = S.aca.gaps[i];
    return `<tr><td class="num">${i + 1}</td>
      <td><textarea data-gap="${i}" data-gf="gap" aria-label="Gap ${i + 1}" style="min-height:60px;">${esc(g.gap)}</textarea></td>
      <td><textarea data-gap="${i}" data-gf="action" aria-label="Action ${i + 1}" style="min-height:60px;">${esc(g.action)}</textarea></td>
      <td><input type="text" data-gap="${i}" data-gf="owner" aria-label="Owner ${i + 1}" value="${esc(g.owner)}"></td>
      <td><select data-gap="${i}" data-gf="due" aria-label="Due ${i + 1}">${dueOpts.replace(`value="${g.due}"`, `value="${g.due}" selected`)}</select></td></tr>`;
  }).join('');
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Step 5: ACA Report</span>
    <h2 class="title">Complete the Apparent Cause Analysis Report</h2>
    <p>In an ACA, the unit manager completes a Manager Review form for the Safety Event Review Team, and the analyst turns it, along with a look at the record, into the ACA Report. Read the manager's review below, then complete the report. Keep your answers free of names and protected health information.</p>
    <details class="reveal" open><summary class="hd" style="cursor:pointer;"><span>Manager Review received from the ${esc(CASE.managerRole)}</span><span class="tag">Six-question Manager Review Template</span></summary><div class="bd">${mgr}</div></details>
    ${fields}
    <div class="question">Gaps in Care or Issues Identified, and Actions to Prevent Recurrence</div>
    <div class="helper">Enter up to three gaps. Complete at least the first row (the gap and its action).</div>
    <div class="tbl-scroll"><table><tr><th style="width:44px">Gap #</th><th>Gap in care or issue identified</th><th>Action to prevent recurrence</th><th>Action owner</th><th>Due</th></tr>${gapRows}</table></div>
    ${S.acaCompared ? `<div class="box"><strong>A model gap table:</strong><div class="tbl-scroll"><table><tr><th>Gap #</th><th>Gap</th><th>Action</th><th>Owner</th><th>Due</th></tr>${ACA_GAPS_MODEL.map((g, i) => `<tr><td class="num">${i + 1}</td><td>${esc(g.gap)}</td><td>${esc(g.action)}</td><td>${esc(g.owner)}</td><td>${g.due}</td></tr>`).join('')}</table></div></div>` : ''}
    ${S.acaCompared ? fb(CASE.acaLimitsTitle, `<ul style="margin:6px 0 0;padding-left:20px;">${ACA_LIMITS.map(l => `<li>${l}</li>`).join('')}</ul>`) : ''}
    ${nav(!S.acaCompared
      ? `<button class="btn" id="cmp" ${acaReady() ? '' : 'disabled'}>Compare with a Model Report</button>`
      : (CASE.expectedLevel === 'ACA'

    app.querySelectorAll('[data-rule]').forEach(cb => cb.onchange = () => { S.rules[rid][+cb.dataset.rule] = cb.checked; });
    document.getElementById('rulesGo').onclick = () => {
      const unmarked = S.rules[rid].map((v, i) => v ? -1 : i).filter(i => i >= 0);
      const f = fobj(rid);
      let msg = '';
      if (unmarked.length && !S.rulesWarned[rid]) msg += `<p>Let's explore the rules you did not mark. Does this statement meet them?</p><ul style="margin:6px 0 0;padding-left:20px;">${unmarked.map(i => `<li>Rule ${i + 1}: ${esc(FIVE_RULES[i])}</li>`).join('')}</ul>`;
      if (f.type !== 'root' && !S.rulesWarned[rid]) msg += `<p>The review team tagged this finding as ${typeObj(f.type).label.toLowerCase()}. Have you thought about whether it has a proven cause and effect relationship, is within leaders' control, and is a good use of resources to correct?</p>`;
      if (msg && !S.rulesWarned[rid]) { S.rulesWarned[rid] = true; document.getElementById('rulesNote').innerHTML = fb('Something to consider.', msg); document.getElementById('rulesGo').textContent = 'Continue Anyway'; return; }
      S.bphase = 'rootnext'; renderFishbone(); window.scrollTo(0, 0);
    };
  }
  app.querySelectorAll('[data-ctx]').forEach(cb => cb.onchange = () => {
    S.ctx = Array.from(app.querySelectorAll('[data-ctx]:checked')).map(x => x.dataset.ctx); syncTags();
    document.getElementById('fishPreview').innerHTML = fishHTML();
  });
  document.getElementById('more').onclick = () => { S.returnTo = 'fishbone'; go('gather2'); };
  const chk = document.getElementById('chk'); if (chk) chk.onclick = () => go('check');
}

// ---------------------------------------------------------------------
// STEP: ROOT CAUSE CHECK AND CAUSAL STATEMENTS
// ---------------------------------------------------------------------
function renderCheck() {
  const act = activeFindings();
  const roots = FINDINGS.filter(f => f.type === 'root');
  const rows = act.map(f => {
    const mine = S.tags[f.id] || {};
    const same = mine.type === f.type;
    const tip = (!same && (mine.type === 'prox' || f.type === 'prox')) ? ' Tip: a proximate cause begins with the role of the person who did or did not act, and a causal factor or root cause describes the condition.' : '';
    const mc = f.type === 'root' ? S.cats[f.id] : '';
    const teamSfm = (f.sfm || []).map(c => sfmObj(c).label).join(' or ');
    const catNote = (mc && f.sfm && !f.sfm.includes(mc)) ? ` The review team classified this root cause as ${teamSfm}. Let's explore what in the sources points to that category.` : '';
    const note = (same ? 'Your tag matches the review team\'s tag.' : `The review team tagged this as ${typeObj(f.type).label.toLowerCase()}. ${f.why}${tip}`) + catNote;
    return `<tr><td>${esc(f.text)}</td><td><span class="chip ${mine.type || 'none'}">${mine.type ? typeObj(mine.type).short : 'None'}</span></td><td><span class="chip ${f.type}">${typeObj(f.type).short}</span></td><td>${f.type === 'root' ? `${mc ? sfmObj(mc).label : 'None chosen'}<br><span class="small">Review team: ${teamSfm}</span>` : ''}</td><td>${esc(note)}</td></tr>`;
  }).join('');
  const found = roots.filter(f => anyGathered(f.needs) && S.tags[f.id] && S.tags[f.id].type === 'root');
  const unseen = roots.filter(f => !anyGathered(f.needs));
  const mistagged = act.filter(f => S.tags[f.id] && S.tags[f.id].type === 'root' && f.type !== 'root');
  const missedTagged = roots.filter(f => anyGathered(f.needs) && !(S.tags[f.id] && S.tags[f.id].type === 'root'));
  let summary = `<p>You tagged <strong>${found.length} of the ${roots.length}</strong> root causes that the review team identified.</p><ul style="margin:6px 0 0;padding-left:20px;">`;
  if (found.length === roots.length) summary += '<li>You reached every root cause the review team identified.</li>';
  missedTagged.forEach(f => summary += `<li>You had the evidence for this one but tagged it differently: ${esc(f.text)}</li>`);
  unseen.forEach(f => summary += `<li>This root cause was not supported by the sources you gathered: ${esc(f.text)} It would have appeared with: ${esc(f.needs.map(srcName).join('; '))}.</li>`);
  mistagged.forEach(f => summary += `<li>You tagged this as a root cause, and the review team tagged it as ${typeObj(f.type).label.toLowerCase()}: ${esc(f.text)}</li>`);
  summary += '</ul>';
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Step 5</span>
    <h2 class="title">Did You Reach the Root Causes?</h2>
    ${fb('How your root causes compare.', summary, true)}
    <h3 style="margin-top:22px;">Your Diagram and the Review Team's Diagram</h3>
    <div class="cmp-grid">
      <div><h4>Your diagram</h4>${fishHTML()}</div>
      <div><h4>The review team's diagram</h4>${fishHTML(TEAM_CHAINS, TEAM_CTX, true)}</div>
    </div>
    ${fb('Where the two diagrams differ.', diffHTML())}
    <h3 style="margin-top:22px;">Your Root Causes by System Failure Mechanism</h3>
    ${catGridHTML()}
    <h3 style="margin-top:22px;">Finding by Finding</h3>
    <div class="tbl-scroll"><table><tr><th>Finding</th><th>Your tag</th><th>Review team</th><th>SFM (root causes)</th><th>Notes</th></tr>${rows}</table></div>
    ${nav(`<button class="btn alt" id="more">Gather More Information</button><button class="btn" id="toAct">Continue to Actions</button>`)}
  </div>`;
  const toAct = document.getElementById('toAct'); if (toAct) toAct.onclick = () => go('actions');
  document.getElementById('more').onclick = () => { S.returnTo = 'fishbone'; go('gather2'); };
}

// ---------------------------------------------------------------------
// STEP: ACTIONS
// ---------------------------------------------------------------------
function newAction() {
  S.actionSeq++;
  return { id: 'ac' + S.actionSeq, text: '', rc: '', cat: '', owner: '', due: '', measure: '', sm: {} };
}
function acaMode() { return S.level === 'ACA' && CASE.expectedLevel === 'ACA'; }
function causeNoun() { return acaMode() ? 'gap' : 'root cause'; }
function studentRoots() {
  if (acaMode()) return S.aca.gaps.map((g, i) => ({ id: 'gap' + (i + 1), text: g.gap })).filter(g => g.text.trim());
  return FINDINGS.filter(f => anyGathered(f.needs) && S.tags[f.id] && S.tags[f.id].type === 'root');
}
function actionNotes(a) {
  const n = [];
  const st = strengthOf(a.cat);
  if (a.text.trim().length < 30) n.push('Have you thought about describing what will change, where, and who will carry it out?');
  if (!a.cat) n.push('Choose a category from the Action Hierarchy so the strength of this action can be ranked.');
  else if (st === 'Weaker') n.push('This action falls in the weaker group. Weaker actions such as training and policy changes are often necessary to set expectations, but used alone they rarely sustain improvement. Is there a stronger or intermediate action alongside it?');
  if (!a.owner.trim()) n.push('RCA2 suggests naming one responsible individual with the authority to act.');
  else if (/committee|team\b|everyone|all staff|nursing$|leadership$/i.test(a.owner)) n.push('A committee or group is harder to hold to a date. Have you thought about naming a single role?');
  if (!a.due) n.push('Choose a due date so the action can be tracked.');
  if (!/\d/.test(a.measure)) n.push('A measure needs an expected level of compliance, such as a percentage or a count.');
  if (!/(day|week|month|quarter|year)/i.test(a.measure)) n.push('Add how long the measure will be tracked, for example monthly for six months.');
  if (!a.rc) n.push(`Link this action to a ${causeNoun()} so its relevance is clear.`);
  // SMARTIES self-check consistency
  const sm = a.sm;
  if (sm.M && (!/\d/.test(a.measure) || !/(day|week|month|quarter|year)/i.test(a.measure))) n.push('You marked Measurable, and the measure still lacks a number or a time period.');
  if (sm.T && !a.due) n.push('You marked Timely, and no due date is chosen.');
  if (sm.R && !a.rc) n.push(`You marked Relevant, and no ${causeNoun()} is linked.`);
  if (sm.S && (a.text.trim().length < 30 || !a.owner.trim())) n.push('You marked Specific, and the action text or the owner could say more.');
  SMARTIES.filter(x => ['A', 'I', 'E', 'Sf'].indexOf(x.k) >= 0 && !sm[x.k]).forEach(x => n.push(`${x.name}: ${x.q}`));
  return n;
}
function renderActions() {
  if (S.actions.length === 0) S.actions.push(newAction());
  const roots = studentRoots();
  const rcList = a => `<label class="fl">${causeNoun() === 'gap' ? 'Gap it addresses (choose one)' : 'Root cause it addresses (choose one)'}</label><div class="picklist" role="radiogroup">${roots.map(r => `<label class="pick"><input type="radio" name="${a.id}_rcr" id="${a.id}_rc_${r.id}" value="${r.id}" data-af="rc" ${a.rc === r.id ? 'checked' : ''}><span class="t" style="font-weight:400;">${esc(r.text)}</span></label>`).join('')}<label class="pick"><input type="radio" name="${a.id}_rcr" id="${a.id}_rc_other" value="other" data-af="rc" ${a.rc === 'other' ? 'checked' : ''}><span class="t" style="font-weight:400;">${acaMode() ? 'A cause I did not list as a gap' : 'A cause I did not tag as a root cause'}</span></label></div>`;
  const catOpts = `<option value="">Choose a category</option>` + HIERARCHY.map(g => `<optgroup label="${g.group}">${g.cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</optgroup>`).join('');
  const dueOpts = `<option value="">Choose a due date</option>` + DUE_OPTIONS.map(d => `<option value="${d}">${d} after approval</option>`).join('');
  const sel = (html, val) => html.replace(`value="${esc(val)}"`, `value="${esc(val)}" selected`);
  const cards = S.actions.map((a, i) => `
    <div class="acard" data-a="${a.id}">
      ${S.actions.length > 1 ? `<button class="rm" data-rm="${a.id}" aria-label="Remove action ${i + 1}">Remove</button>` : ''}
      <h4 style="margin:0 0 4px;">Action ${i + 1} ${a.cat ? `<span class="chip ${strengthOf(a.cat) === 'Stronger' ? 'root' : strengthOf(a.cat) === 'Intermediate' ? 'causal' : 'non'}">${strengthOf(a.cat)}</span>` : ''}</h4>
      <label class="fl" for="${a.id}_t">What will change, where, and who will carry it out?</label>
      <textarea id="${a.id}_t" data-af="text">${esc(a.text)}</textarea>
      ${rcList(a)}
      <div class="grid2">
        <div><label class="fl" for="${a.id}_c">Action Hierarchy category</label><select id="${a.id}_c" data-af="cat">${sel(catOpts, a.cat)}</select></div>
        <div><label class="fl" for="${a.id}_o">Responsible person (a role)</label><input type="text" id="${a.id}_o" data-af="owner" value="${esc(a.owner)}"></div>
        <div><label class="fl" for="${a.id}_d">Due date</label><select id="${a.id}_d" data-af="due">${sel(dueOpts, a.due)}</select></div>
      </div>
      <label class="fl" for="${a.id}_m">Measure: what, for how long, and the expected compliance</label>
      <textarea id="${a.id}_m" data-af="measure">${esc(a.measure)}</textarea>
      <label class="fl">SMART(IES) self-check: mark each letter you believe this action meets</label>
      <div class="smart">${SMARTIES.map(x => `<label title="${esc(x.q)}"><input type="checkbox" data-sm="${x.k}" ${a.sm[x.k] ? 'checked' : ''}> ${x.name}</label>`).join('')}</div>
    </div>`).join('');
  let result = '';
  if (S.actionsChecked) {
    const blocks = S.actions.map((a, i) => {
      const n = actionNotes(a);
      return `<li><strong>Action ${i + 1}${a.cat ? ' (' + strengthOf(a.cat) + ')' : ''}:</strong> ${n.length ? `<ul style="margin:4px 0 8px;padding-left:20px;">${n.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : 'Your entries meet each of the checks in this tool.'}</li>`;
    }).join('');
    const cov = roots.map(r => {
      const linked = S.actions.filter(a => a.rc === r.id && ['Stronger', 'Intermediate'].indexOf(strengthOf(a.cat)) >= 0);
      return linked.length ? '' : `<li>No stronger or intermediate action is linked to this ${causeNoun()}: ${esc(r.text)}</li>`;
    }).join('');
    result = fb('How your action plan reads.', `<ul style="margin:6px 0 0;padding-left:20px;">${blocks}</ul>${cov ? `<p style="margin:8px 0 0;"><strong>Coverage:</strong> RCA2 recommends at least one stronger or intermediate action for each ${causeNoun()}.</p><ul style="padding-left:20px;margin:4px 0 0;">${cov}</ul>` : (roots.length ? `<p style="margin:8px 0 0;"><strong>Coverage:</strong> every ${causeNoun()} you listed has at least one stronger or intermediate action.</p>` : `<p style="margin:8px 0 0;">${acaMode() ? 'List gaps in the ACA report so each action can be linked to one.' : 'Tag root causes on the diagram so each action can be linked to one.'}</p>`)}`, true);
    result += `<h3 style="margin-top:22px;">The Review Team's Action Plan</h3><p class="small">Your plan does not need to match this one. Compare the strength of the actions, the owners, and the measures.</p>
      <div class="tbl-scroll"><table><tr><th>${acaMode() ? 'Gap' : 'Root cause'}</th><th>Action</th><th>Strength</th><th>Owner and due</th><th>Measure</th></tr>${TEAM_ACTIONS.map(t => `<tr><td>${esc(t.rc)}</td><td>${esc(t.action)}</td><td>${t.strength}<br><span class="small">${esc(t.cat)}</span></td><td>${esc(t.owner)}<br><span class="small">${t.due} after approval</span></td><td>${esc(t.measure)}</td></tr>`).join('')}</table></div>
      <div class="box"><strong>Also in the review team's plan.</strong> ${esc(CASE.teamActionsNote)} ${esc(IMMEDIATE_ACTIONS)}</div>`;
  }
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Step 6</span>
    <h2 class="title">Write the Actions and Check Them</h2>
    <p>For each ${causeNoun()}, write an action that would prevent recurrence or reduce its effect. Rank each action with the RCA2 Action Hierarchy and check it against the SMART(IES) criteria: <strong>S</strong>pecific, <strong>M</strong>easurable, <strong>A</strong>ttainable, <strong>R</strong>elevant, <strong>T</strong>imely, <strong>I</strong>nclusive, <strong>E</strong>quitable, and <strong>S</strong>afe.</p>
    <div class="box"><strong>The Action Hierarchy (RCA2)</strong><ul>${HIERARCHY.map(g => `<li><strong>${g.group}:</strong> ${g.cats.join('; ')}.</li>`).join('')}</ul></div>
    <div id="acards">${cards}</div>
    ${nav(`<button class="btn alt" id="add" ${S.actions.length >= 6 ? 'disabled' : ''}>Add Another Action</button><button class="btn dark" id="chk">Check My Plan</button>`)}
    <div id="aresult">${result}</div>
    ${S.actionsChecked ? nav(`<button class="btn" id="toSum">Continue to the Summary</button>`) : ''}
  </div>`;
  app.querySelectorAll('.acard').forEach(card => {
    const a = S.actions.find(x => x.id === card.dataset.a);
    card.querySelectorAll('[data-af]').forEach(el => {
      const upd = () => {
        a[el.dataset.af] = el.value;
        if (el.dataset.af === 'cat') {
          const chip = card.querySelector('h4'); const s = strengthOf(a.cat);
          chip.innerHTML = `Action ${S.actions.indexOf(a) + 1} ` + (a.cat ? `<span class="chip ${s === 'Stronger' ? 'root' : s === 'Intermediate' ? 'causal' : 'non'}">${s}</span>` : '');
        }
      };
      el.oninput = upd; el.onchange = upd;
    });
    card.querySelectorAll('[data-sm]').forEach(cb => cb.onchange = () => { a.sm[cb.dataset.sm] = cb.checked; });
  });
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { S.actions = S.actions.filter(x => x.id !== b.dataset.rm); S.actionsChecked = false; renderActions(); });
  document.getElementById('add').onclick = () => { S.actions.push(newAction()); S.actionsChecked = false; renderActions(); };
  document.getElementById('chk').onclick = () => { S.actionsChecked = true; const y = window.scrollY; renderActions(); window.scrollTo(0, y); setTimeout(() => { const r = document.getElementById('aresult'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); };
  const toSum = document.getElementById('toSum'); if (toSum) toSum.onclick = () => go('summary');
}

// ---------------------------------------------------------------------
// STEP: SUMMARY
// ---------------------------------------------------------------------
function elapsed() { const s = Math.round((Date.now() - S.start) / 1000); return Math.floor(s / 60) + ' min ' + (s % 60) + ' sec'; }
function renderSummary() {
  const roots = FINDINGS.filter(f => f.type === 'root');
  const found = roots.filter(f => anyGathered(f.needs) && S.tags[f.id] && S.tags[f.id].type === 'root').length;
  const recNames = RECORDS.filter(r => S.rec.has(r.id)).map(r => r.title);
  const intNames = INTERVIEWS.filter(i => S.int.has(i.id)).map(i => i.role);
  const levelLabel = CASE.expectedLevel === 'ACA' ? 'ACA (completed), compared with a model report' : S.level === 'ACA' ? 'ACA (completed), compared with a full analysis' : (S.triedACA ? 'ACA explored, then RCA' : 'RCA');
  const actionRows = S.actions.filter(a => a.text.trim()).map((a, i) => {
    const smChecked = SMARTIES.filter(x => a.sm[x.k]).map(x => x.name).join(', ') || 'None marked';
    return `<tr><td>${i + 1}. ${esc(a.text)}</td><td>${a.cat ? strengthOf(a.cat) + '<br><span class="small">' + esc(a.cat) + '</span>' : ''}</td><td>${esc(a.owner)}<br><span class="small">${esc(a.due)}</span></td><td>${esc(a.measure)}</td><td class="small">${esc(smChecked)}</td></tr>`;
  }).join('');
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Case ${CASE.num} Complete</span>
    <h2 class="title">Comprehensive Safety Analysis Summary</h2>
    <div class="nameline noprint"><label for="nm"><strong>Your name (for the printed summary):</strong></label><input type="text" id="nm" value="${esc(S.name)}"></div>
    <p class="printonly"><strong>Student:</strong> <span id="nmPrint">${esc(S.name)}</span></p>
    <p class="small">HCA 880: Patient Safety and Risk &middot; Case ${CASE.num}: ${CASE.title} &middot; Time on task: ${elapsed()} &middot; ${new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
    <table>
      <tr><th style="width:30%">Step</th><th>Your work</th></tr>
      <tr><td>SAC score</td><td>${SAC[S.prob][S.sev]} (${SEVERITY.find(s => s.key === S.sev).label} severity, ${PROBABILITY.find(p => p.key === S.prob).label} probability)</td></tr>
      <tr><td>Level of analysis</td><td>${levelLabel}</td></tr>
      <tr><td>Chart review</td><td>${recNames.length ? esc(recNames.join('; ')) : 'None'}</td></tr>
      <tr><td>Interviews</td><td>${intNames.length ? esc(intNames.join('; ')) : 'None'}</td></tr>
      ${CASE.expectedLevel === 'ACA' ? '' : `<tr><td>Root causes</td><td>${found} of ${roots.length} root causes identified by the review team were tagged by you</td></tr>`}
    </table>
    <h3 style="margin-top:22px;">Timeline from Your Fact Finding</h3>${timelineHTML()}
    ${activeFindings().some(f => S.tags[f.id] && S.tags[f.id].type) ? `<h3 style="margin-top:22px;">Your Cause and Effect Diagram (read from top to bottom)</h3>${fishHTML()}` : ''}
    ${S.aca.occ.trim() ? `<h3 style="margin-top:22px;">Your ACA Report</h3><table>${ACA_FIELDS.map(f => `<tr><td style="width:30%">${esc(f.label)}</td><td>${esc(S.aca[f.id])}</td></tr>`).join('')}</table>${S.aca.gaps.some(g => g.gap.trim()) ? `<table><tr><th>Gap #</th><th>Gap</th><th>Action</th><th>Owner</th><th>Due</th></tr>${S.aca.gaps.map((g, i) => g.gap.trim() ? `<tr><td class="num">${i + 1}</td><td>${esc(g.gap)}</td><td>${esc(g.action)}</td><td>${esc(g.owner)}</td><td>${esc(g.due)}</td></tr>` : '').join('')}</table>` : ''}` : ''}
    ${actionRows ? `<h3 style="margin-top:22px;">Your Action Plan</h3><div class="tbl-scroll"><table><tr><th>Action</th><th>Strength</th><th>Owner and due</th><th>Measure</th><th>SMART(IES) marked</th></tr>${actionRows}</table></div>` : ''}
    ${fb('A note on the people involved.', CASE.peopleNote)}
    ${nav(`<button class="btn dark" id="print">Print or Save as PDF</button><button class="btn alt" id="restart">Start Over</button>`)}
    <p class="small noprint" style="text-align:right;">In the print dialog, choose "Save as PDF" to create the file you will submit to your instructor.</p>
  </div>`;
  const nm = document.getElementById('nm');
  nm.oninput = () => { S.name = nm.value; document.getElementById('nmPrint').textContent = nm.value; };
  document.getElementById('print').onclick = () => window.print();
  document.getElementById('restart').onclick = () => { if (confirm('Start over? Your work in this session will be cleared.')) location.reload(); };
  try { if (window.parent !== window) window.parent.postMessage({ type: 'csa-complete', caseNum: CASE.num }, '*'); } catch (e) {}
}

// ---------------------------------------------------------------------
// ROUTER
// ---------------------------------------------------------------------
function render() {
  const s = S.step;
  if (s === 'intro') renderIntro();
  else if (s === 'harm') renderHarm();
  else if (s === 'level') renderLevel();
  else if (s === 'gather') renderGather(1);
  else if (s === 'gather2') renderGather(2);
  else if (s === 'timeline') renderTimeline();
  else if (s === 'aca') renderACA();
  else if (s === 'fishbone') renderFishbone();
  else if (s === 'check') renderCheck();
  else if (s === 'actions') renderActions();
  else if (s === 'summary') renderSummary();
}
renderStepper();
render();
</script>
</body>
</html>
