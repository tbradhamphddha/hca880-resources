<style>
  /* Edgewood web palette: Edgewood Red, Black, White, Dark Gold, Medium Gold, Dark Web Grey, Warm Web Grey */
  :root {
    --red: #BB0000;
    --red-dark: #930000;
    --black: #000000;
    --white: #FFFFFF;
    --gold: #C8932B;
    --gold-med: #CEB06A;
    --grey: #58595B;
    --warm: #F0EEEB;
    --gold-wash: #FAF4E6;
    --line: #D9D5CF;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', Arial, sans-serif;
    background: var(--warm);
    color: var(--black);
    margin: 0;
    line-height: 1.6;
    font-size: 17px;
  }
  h1, h2, h3, h4 { font-family: 'Spectral', Georgia, serif; line-height: 1.25; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px 60px; }

  /* Resource header (inside the constraining wrapper) */
  .resource-header {
    background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
    color: var(--white);
    padding: 0.8rem 1.5rem;
    display: flex; align-items: center; gap: 1rem;
    position: relative;
    margin: 0 -20px;
  }
  .resource-header::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--red) 0%, var(--red) 33%, var(--gold) 33%, var(--gold) 66%, var(--gold-med) 66%, var(--gold-med) 100%);
  }
  .resource-header-logo { height: 40px; width: auto; border-radius: 4px; flex-shrink: 0; }
  .resource-header-text { flex: 1; min-width: 0; }
  .resource-header-course { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); line-height: 1.2; }
  .resource-header-title { font-size: 1.05rem; font-weight: 600; color: var(--white); line-height: 1.3; }
  .resource-header-back {
    flex-shrink: 0; display: flex; align-items: center; gap: 0.3rem; font-size: 0.78rem;
    color: #E6E3DE; text-decoration: none; padding: 0.35rem 0.7rem; border-radius: 4px; white-space: nowrap;
  }
  .resource-header-back:hover { color: var(--white); background: rgba(255,255,255,0.1); }
  .resource-header-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
  @media (max-width: 600px) {
    .resource-header { flex-wrap: wrap; padding: 0.7rem 1rem; gap: 0.6rem; }
    .resource-header-back { order: -1; width: 100%; padding: 0.2rem 0; font-size: 0.72rem; }
    .resource-header-title { font-size: 0.95rem; }
  }
  .accent-bar { height: 6px; background: var(--red); margin: 0 -20px; }

  /* Stepper */
  .stepper { display: flex; gap: 6px; margin: 22px 0 6px; flex-wrap: wrap; }
  .stepper .st {
    flex: 1 1 100px; font-size: 0.74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
    color: var(--grey); border-top: 4px solid var(--line); padding-top: 6px;
  }
  .stepper .st.done { border-top-color: var(--gold); color: var(--black); }
  .stepper .st.now { border-top-color: var(--red); color: var(--red); }

  .card {
    background: var(--white); border: 1px solid var(--line); border-radius: 6px;
    padding: 24px 26px; margin-top: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .step-label {
    display: inline-block; background: var(--gold); color: var(--white); font-size: 0.78rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; padding: 3px 10px; border-radius: 3px; margin-bottom: 10px;
  }
  .title { font-size: 1.45rem; margin: 0 0 12px; }
  .lead { font-size: 1.05rem; }
  .vignette {
    background: var(--warm); border-left: 4px solid var(--gold); padding: 14px 18px; border-radius: 4px; margin: 14px 0 18px; font-size: 0.98rem;
  }
  .question { font-weight: 700; margin: 16px 0 4px; font-size: 1.05rem; }
  .helper { font-size: 0.92rem; color: var(--grey); margin: 4px 0 12px; }
  .box {
    background: var(--warm); border: 1px solid var(--line); border-radius: 4px; padding: 12px 16px; margin: 14px 0; font-size: 0.92rem; color: var(--grey);
  }
  .box strong { color: var(--black); }
  .box ul { margin: 6px 0 0; padding-left: 20px; }
  .box li { margin-bottom: 3px; }
  .pswp {
    background: var(--gold-wash); border: 1px solid var(--gold-med); border-left: 4px solid var(--gold);

  }

  /* Option buttons */
  .options { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .opt {
    flex: 1 1 200px; background: var(--white); border: 2px solid var(--grey); color: var(--black);
    font-family: inherit; font-size: 0.97rem; font-weight: 600; padding: 12px 16px; border-radius: 5px;
    cursor: pointer; text-align: left; transition: all .15s ease;
  }
  .opt small { display: block; font-weight: 400; color: var(--grey); margin-top: 2px; font-size: 0.82rem; }
  .opt:hover:not(:disabled) { background: var(--black); color: var(--white); border-color: var(--black); }
  .opt:hover:not(:disabled) small { color: #E6E3DE; }
  .opt.chosen { background: var(--black); border-color: var(--black); color: var(--white); }
  .opt.chosen small { color: #E6E3DE; }
  .opt:disabled { cursor: default; }
  .opt:disabled:not(.chosen) { opacity: .5; }
  .opt:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .pick:focus-within {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }

  .feedback {
    margin-top: 16px; padding: 14px 18px; border-radius: 5px; font-size: 0.97rem;
    background: var(--warm); border-left: 4px solid var(--gold); animation: fadein .25s ease;
  }
  .feedback.strong { border-left-color: var(--black); }
  .feedback .lbl { font-weight: 700; display: block; margin-bottom: 4px; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .nav { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    background: var(--red); color: var(--white); border: none; font-family: inherit; font-size: 1rem; font-weight: 700;
    padding: 11px 26px; border-radius: 5px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--red-dark); }
  .btn:disabled { background: var(--line); color: var(--grey); cursor: not-allowed; }
  .btn.alt { background: transparent; color: var(--grey); border: 2px solid var(--grey); padding: 9px 22px; }
  .btn.alt:hover:not(:disabled) { background: var(--grey); color: var(--white); }
  .btn.dark { background: var(--black); }
  .btn.dark:hover:not(:disabled) { background: #333; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 10px; }
  th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: var(--black); color: var(--white); font-family: 'Spectral', Georgia, serif; font-weight: 600; }
  tr:nth-child(even) td { background: var(--warm); }
  td.num { text-align: center; font-weight: 700; }
  td.hot { background: var(--gold-wash) !important; outline: 2px solid var(--red); outline-offset: -2px; font-weight: 700; }
  .tbl-scroll { overflow-x: auto; }

  /* Pick lists (records, interviews, gaps) */
  .picklist { display: grid; gap: 8px; margin-top: 10px; }
  .pick {
    display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 5px; padding: 10px 14px;
    background: var(--white); cursor: pointer;
  }
  .pick:hover { border-color: var(--grey); }
  .pick input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--red); flex-shrink: 0; }
  .pick .t { font-weight: 600; }
  .pick .d { font-size: 0.85rem; color: var(--grey); }
  .pick.disabled { opacity: .5; cursor: not-allowed; }
  .counter { font-size: 0.9rem; font-weight: 700; color: var(--red); }

  /* Reveal panels */
  .reveal { border: 1px solid var(--line); border-radius: 5px; margin-top: 12px; overflow: hidden; background: var(--white); }
  .reveal > .hd { background: var(--black); color: var(--white); padding: 8px 14px; font-weight: 600; font-size: 0.93rem; display: flex; justify-content: space-between; gap: 10px; }
  .reveal > .hd .tag { color: var(--gold-med); font-weight: 400; font-size: 0.8rem; }
  .reveal > .bd { padding: 12px 16px; font-size: 0.93rem; }
  .reveal > .bd p { margin: 0 0 8px; }
  .reveal .mono { font-family: Consolas, Menlo, monospace; font-size: 0.84rem; background: var(--warm); padding: 8px 10px; border-radius: 4px; display: block; margin: 6px 0; }
  .reveal .quote { border-left: 3px solid var(--gold-med); padding-left: 12px; font-style: italic; }
  .reveal .ynote { margin-top: 8px; font-size: 0.85rem; color: var(--grey); }

  /* Timeline */
  .tl { border-left: 3px solid var(--grey); margin: 12px 0 4px 8px; padding-left: 0; }
  .tl .ev { position: relative; padding: 4px 0 10px 22px; }
  .tl .ev::before { content: ''; position: absolute; left: -9px; top: 10px; width: 14px; height: 14px; border-radius: 50%; background: var(--white); border: 3px solid var(--black); }
  .tl .ev.gap::before { border-color: var(--red); background: var(--red); }
  .tl .ev .tm { font-weight: 700; font-family: 'Spectral', Georgia, serif; }
  .tl .ev.gap { color: var(--red); font-weight: 600; }
  .tl .ev .src { font-size: 0.78rem; color: var(--grey); }

  /* Cause and effect chain (reads top to bottom) */
  .chain { display: flex; flex-direction: column; align-items: stretch; }
  .chain-head { background: var(--black); color: var(--white); border-radius: 6px; padding: 12px 16px; font-family: 'Spectral', Georgia, serif; font-size: 1rem; text-align: center; }
  .chain-head small { display: block; font-family: 'Source Sans 3', 'Source Sans Pro', sans-serif; font-size: 0.7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-med); margin-bottom: 2px; }
  .chain .link { text-align: center; font-size: 1.3rem; line-height: 1.1; color: var(--grey); padding: 4px 0; }
  .tier { border: 1px solid var(--line); border-left: 6px solid var(--grey); border-radius: 4px; padding: 10px 14px; background: var(--warm); }
  .tier.prox { border-left-color: var(--black); }
  .tier.causal { border-left-color: var(--gold); }
  .tier.root { border-left-color: var(--red); }
  .tier h5 { margin: 0 0 8px; font-family: 'Spectral', Georgia, serif; font-size: 0.95rem; }
  .tier .item { margin: 0 0 7px; line-height: 1.4; font-size: 0.93rem; }
  .fish { margin-top: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--white); padding: 14px; }
  .chip { display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; padding: 1px 6px; border-radius: 3px; margin-right: 5px; vertical-align: 1px; }
  .chip.root { background: var(--red); color: var(--white); }
  .chip.causal { background: var(--gold); color: var(--white); }
  .chip.prox { background: var(--black); color: var(--white); }
  .chip.non { background: var(--line); color: var(--grey); }
  .chip.none { background: var(--white); border: 1px dashed var(--grey); color: var(--grey); }
  .chip.cat { background: var(--white); border: 1px solid var(--grey); color: var(--grey); }

  .cmp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
  .cmp-grid h4 { margin: 16px 0 0; font-family: 'Spectral', Georgia, serif; font-size: 1.05rem; }
  .cmp-grid .fish { margin-top: 8px; }
  .chip.lock { background: var(--gold-wash); border: 1px dashed var(--gold); color: var(--black); }
  /* Finding cards */
  .fcard { border: 1px solid var(--line); border-radius: 5px; padding: 12px 14px; margin-top: 10px; background: var(--white); }
  .fcard.locked { background: var(--warm); color: var(--grey); }
  .fcard .ft { font-size: 0.97rem; margin-bottom: 8px; }
  .fcard .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .fcard label { font-size: 0.78rem; font-weight: 700; color: var(--grey); text-transform: uppercase; letter-spacing: .4px; display: block; }
  select, input[type=text], input[type=number], textarea {
    font-family: inherit; font-size: 0.93rem; border: 2px solid var(--grey); border-radius: 4px; padding: 7px 9px; background: var(--white); color: var(--black); width: 100%;
  }
  textarea { min-height: 74px; resize: vertical; }
  td select { min-width: 104px; }
  .fcard .col { flex: 1 1 200px; }

  /* Action cards */
  .acard { border: 1px solid var(--line); border-top: 4px solid var(--red); border-radius: 5px; padding: 14px 16px; margin-top: 14px; background: var(--white); }
  .acard .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  @media (max-width: 640px) { .acard .grid2 { grid-template-columns: 1fr; } }
  .acard label.fl { font-size: 0.78rem; font-weight: 700; color: var(--grey); text-transform: uppercase; letter-spacing: .4px; display: block; margin: 8px 0 3px; }
  .smart { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  @media (max-width: 640px) { .smart { grid-template-columns: repeat(2, 1fr); } }
  .smart label { font-size: 0.85rem; display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; cursor: pointer; background: var(--warm); }
  .smart input { accent-color: var(--red); width: 16px; height: 16px; }
  .rm { background: none; border: none; color: var(--red); font-weight: 700; cursor: pointer; float: right; font-family: inherit; }

  .stat { display: inline-block; background: var(--red); color: var(--white); font-family: 'Spectral', Georgia, serif; font-size: 1.6rem; font-weight: 700; padding: 10px 26px; border-radius: 6px; margin: 8px 0; }
  .small { font-size: 0.85rem; color: var(--grey); }
  .printonly { display: none; }
  .nameline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .nameline input { max-width: 340px; }

  .resource-footer { text-align: center; padding: 1.5rem; font-size: 0.75rem; color: var(--grey); border-top: 1px solid var(--line); background: var(--white); margin: 40px -20px -60px; }
  .resource-footer a { color: var(--grey); text-decoration: underline; }

  @media print {
    body { background: #fff; font-size: 11pt; }
    .resource-header, .accent-bar, .stepper, .nav, .noprint, .resource-footer, .btn, .rm { display: none !important; }
    .card { box-shadow: none; border: none; padding: 0; margin-top: 10px; }
    .printonly { display: block; }
    .wrap { max-width: none; padding: 0; }
    .reveal, .acard, .fish, .fcard, .tier { break-inside: avoid; }
    th { background: #000 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .chip, .chain-head, .stat { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// =====================================================================
// CASE DATA: CASE 2 (STEMI: Delayed Escalation)
// All chart entries and interview notes below are fictional teaching
// material written to stay consistent with the Case 2 event description.
// No real patients, staff, or organizations are represented.
// =====================================================================
const CASE = {
  num: 2,
  title: "STEMI: Delayed Escalation",
  expectedLevel: "RCA",
  vignette: `A 71-year-old patient with a history of hypertension and diabetes is admitted to the intensive care unit following an acute exacerbation of congestive heart failure. On the second day of admission, the patient reports new onset chest pressure radiating to the left arm, rated 7 out of 10. The bedside nurse administers acetaminophen per standing orders and reassesses 45 minutes later. The patient's pain has not improved and the nurse documents the complaint in the chart. A second-year resident reviews the chart remotely, orders a basic metabolic panel and cardiac enzymes, and notes the complaint. An EKG is obtained by the telemetry tech and transmitted to the system. The EKG reveals ST-elevation in leads II, III, and aVF, consistent with an acute inferior wall myocardial infarction. The result is available in the electronic health record for 38 minutes before anyone acts on it. The attending cardiologist is paged twice and does not respond. The resident does not attempt additional contact and does not activate the rapid response team or the facility's STEMI protocol. The nurse, aware that the cardiologist has not responded and that the patient's condition is worsening, does not escalate through available channels. The patient progresses to hemodynamic instability, a code blue is called, and the patient expires despite resuscitative efforts.`,
  eventName: "38-minute delay in treating an acute inferior STEMI; patient death"
};

// ---------------------------------------------------------------------
// SAC MATRIX (RCA2 Appendix 1)
// ---------------------------------------------------------------------
const SEVERITY = [
  { key: "catastrophic", label: "Catastrophic", desc: "Death or major permanent loss of function not related to the natural course of the illness" },
  { key: "major", label: "Major", desc: "Permanent lessening of function, disfigurement, or surgical intervention required" },
  { key: "moderate", label: "Moderate", desc: "Increased length of stay or increased level of care for one or two patients" },
  { key: "minor", label: "Minor", desc: "No injury, no increased length of stay, no increased level of care" }
];
const PROBABILITY = [
  { key: "frequent", label: "Frequent", desc: "Likely to occur immediately or within a short period (several times in 1 year)" },
  { key: "occasional", label: "Occasional", desc: "Probably will occur (several times in 1 to 2 years)" },
  { key: "uncommon", label: "Uncommon", desc: "Possible to occur (sometime in 2 to 5 years)" },
  { key: "remote", label: "Remote", desc: "Unlikely to occur (sometime in 5 to 30 years)" }
];
const SAC = {
  frequent:   { catastrophic: 3, major: 3, moderate: 2, minor: 1 },
  occasional: { catastrophic: 3, major: 2, moderate: 1, minor: 1 },
  uncommon:   { catastrophic: 3, major: 2, moderate: 1, minor: 1 },
  remote:     { catastrophic: 3, major: 2, moderate: 1, minor: 1 }
};

// ---------------------------------------------------------------------
// LEVEL OF ANALYSIS
// ---------------------------------------------------------------------
const LEVELS = [
  { key: "none", label: "No CSA needed", sub: "Track and trend the event" },
  { key: "ACA", label: "Apparent Cause Analysis (ACA)", sub: "A less formal review for less significant events" },
  { key: "CCA", label: "Common Cause Analysis (CCA)", sub: "A review across several similar events" },
  { key: "RCA", label: "Root Cause Analysis (RCA)", sub: "A formal, in-depth review (RCA2)" }
];

// ---------------------------------------------------------------------
// CHART REVIEW ITEMS
// ---------------------------------------------------------------------
const RECORDS = [
  { id: "r_nursing", title: "Nursing notes and vital signs flowsheet", sub: "Night shift, 01:00 to 03:36",
    body: `<span class="mono">01:50  Patient reports new chest pressure radiating to left arm, 7/10.<br>01:55  Acetaminophen 650 mg PO given per standing PRN pain order.<br>02:40  Reassessed. Pain unchanged at 7/10. HR 96, BP 148/88, RR 20, SpO2 94% on 2 L. Documented in chart.<br>03:20  Pain 8/10, diaphoretic. Resident aware, awaiting cardiology callback. HR 112, BP 112/70, RR 24, SpO2 92%.<br>03:33  HR 128, BP 78/40, SpO2 88%.</span><p>Observations: no provider notification is documented at 01:50 or 02:40 (documentation entries only). The flowsheet has no entries between 03:20 and 03:33.</p>` },
  { id: "r_orders", title: "Physician orders and order audit trail", sub: "Resident and attending orders for this admission day",
    body: `<span class="mono">02:46  Orders entered by PGY-2 (remote workstation): basic metabolic panel, troponin.<br>02:58  12-lead EKG performed by telemetry technician. Entered as "tech-initiated per unit practice, chest pain on board."</span><p>Observations: no provider entered an EKG order. No STEMI alert, rapid response activation, or cardiology consult order appears before the code blue at 03:36.</p>` },
  { id: "r_ekg", title: "12-lead EKG tracing and result audit trail", sub: "Tracing, machine read, and who opened it",
    body: `<span class="mono">02:58  Tracing acquired and filed to the EHR.<br>Machine read: ST elevation in II, III, aVF. Consider acute inferior MI.<br>Result opened: 03:02 (PGY-2); 03:08 (bedside RN).<br>Automated critical-result alert: not triggered (tracing filed without an ordering provider).</span><p>Observations: two clinicians opened the tracing within ten minutes of filing.</p>` },
  { id: "r_paging", title: "Paging and secure messaging log", sub: "Hospital pager and secure chat, 02:45 to 03:45",
    body: `<span class="mono">03:04  Page #1, PGY-2 to cardiology on-call attending (hospital pager). Delivered. No callback.<br>03:08  Secure message, RN to PGY-2: "EKG looks like a STEMI. Pain 8/10, sweaty. Any word from cards?"<br>03:09  PGY-2 reply: "Paged him, waiting for callback."<br>03:19  Page #2, PGY-2 to cardiology on-call attending. Delivered. No callback.<br>03:38  Charge RN calls attending's mobile phone (during code).<br>03:41  Attending returns the call.</span><p>Observations: no page or call to a backup cardiology contact, the STEMI line, the cath lab, or the rapid response line before 03:36. The attending's mobile number is on the unit's informal contact sheet but is not in the on-call directory.</p>` },
  { id: "r_code", title: "Code blue record", sub: "Resuscitation details and outcome",
    body: `<span class="mono">03:36  Code blue called. Rhythm: ventricular fibrillation.<br>ACLS per protocol, 3 defibrillations, epinephrine per protocol. Return of circulation not achieved.<br>04:12  Death pronounced.</span><p>This record documents the resuscitation and outcome. It does not add detail about the period before 03:36.</p>` },
  { id: "r_stemi_policy", title: "STEMI protocol policy", sub: "Hospital-wide policy",

  }).join('');

function levelFeedback(key) {
  if (key === 'none') return fb('Let\'s explore that more.', 'Tracking and trending suits events with a low SAC score and no unanswered question about cause. This event scored 3, and a death is a sentinel event. Without an analysis, the conditions that allowed the delay would stay in place. Have you thought about what the organization would learn, and what it would miss, if it only counted this event?');
  if (key === 'ACA') return fb('That is one way to view this.', 'An Apparent Cause Analysis is a less formal process used for less significant events. It asks what happened, what should have happened, and why the expected process did not occur, usually from a few conversations. Consider the SAC score and the sentinel event status: would a less formal review satisfy the organization and its accrediting body? You can reconsider, or complete an ACA to see what it surfaces and compare it with a full analysis.');
  if (key === 'CCA') return fb('Let\'s think about what a CCA needs.', 'A Common Cause Analysis looks across several similar events to find the causes they share. You have one event in hand. The Substitution Test pattern suggests this condition may exist beyond this unit, so a CCA could be a useful follow-up across units, which links to the idea of transportability. For this event, though, you need a deeper look at a single death first. Which level fits that?');
  return fb('Your choice aligns with the evidence.', 'A SAC score of 3 and a sentinel event call for a comprehensive systematic analysis. An RCA (RCA2) is a formal process that asks what happened, why it happened, and what to do to prevent recurrence, and it focuses on system causes instead of individual blame. A CCA can follow later to look for the same pattern elsewhere.', true);
}

function gapState(g) {

}

  const gapList = GAPS.map(g => `<label class="pick"><input type="checkbox" data-gap="${g.id}" ${S.gapsMarked.has(g.id) ? 'checked' : ''}><span class="t" style="font-weight:400;">${esc(g.text)}</span></label>`).join('');

        lines.push(`<li><strong>Your fact finding already speaks to this:</strong> ${esc(g.text)} See: ${esc(srcs)}.</li>`);
      } else if (marked && st === 'distractor') lines.push(`<li><strong>Let's test this one:</strong> ${esc(g.text)} ${esc(g.why)}</li>`);

  }

  <div class="card">
    <span class="step-label">Step 4</span>
    <h2 class="title">Build the Timeline and Identify the Gaps</h2>
    <p>This sequence of events is built from the sources you gathered. Red entries mark periods with no documentation.</p>

  </div>`;
  app.querySelectorAll('[data-gap]').forEach(cb => cb.onchange = () => { cb.checked ? S.gapsMarked.add(cb.dataset.gap) : S.gapsMarked.delete(cb.dataset.gap); S.gapsChecked = false; renderTimelineKeepScroll(); });

  const more = document.getElementById('more'); if (more) more.onclick = () => { S.gapsChecked = false; S.returnTo = null; go('gather2'); };

function activeFindings() { return FINDINGS.filter(f => anyGathered(f.needs)); }

function rootsOf(c) { return Array.isArray(c.root) ? c.root : (c.root ? [c.root] : []); }
function fishHTML(chains, ctx, team) {
  chains = chains || S.chains; ctx = ctx || S.ctx;
  const fobj = id => FINDINGS.find(f => f.id === id);
  const lockChip = id => (team && !anyGathered(fobj(id).needs)) ? '<span class="chip lock">Not yet found</span>' : '';
  const catChip = id => { const f = fobj(id); const c = team ? (f.sfm && f.sfm[0]) : S.cats[id]; return (c && f.type === 'root' && sfmObj(c)) ? `<span class="chip cat">${sfmObj(c).label}</span>` : ''; };
  const itemHTML = (id, k) => `<div class="item"><span class="chip ${k}">${typeObj(k).short}</span>${catChip(id)}${lockChip(id)}${esc(fobj(id).text)}</div>`;
  const tier = (k, head, sub, ids) => `<div class="link" aria-hidden="true">&#8595;</div><div class="tier ${k}"><h5>${head} <span class="small">(${sub})</span></h5>${ids.map(i => itemHTML(i, k)).join('')}</div>`;
  const parts = [];
  chains.forEach((c, n) => {
    if (chains.length > 1) parts.push(`<div class="small" style="margin-top:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;">Chain ${n + 1}</div>`);
    parts.push(tier('prox', 'What happened', 'Proximate cause', [c.prox]));
    if (c.causal.length) parts.push(tier('causal', 'Conditions that shaped what happened', 'Causal factors', c.causal));
    if (rootsOf(c).length) parts.push(tier('root', 'Which stem from', rootsOf(c).length > 1 ? 'Root causes' : 'Root cause', rootsOf(c)));
  });
  if (ctx.length) parts.push(tier('non', 'Also examined', 'Context, not causal', ctx));
  const empty = parts.length ? '' : '<div class="link" aria-hidden="true">&#8595;</div><div class="small" style="text-align:center;">Your diagram will build here as you add each link.</div>';
  return `<div class="fish chain"><div class="chain-head"><small>The event</small>${esc(CASE.eventName)}</div>${parts.join('')}${empty}</div>`;
}
function linkSet(chains) {
  const set = new Set();
  chains.forEach(c => {
    const rs = rootsOf(c);
    c.causal.forEach(x => { set.add(c.prox + '>' + x); rs.forEach(r => set.add(x + '>' + r)); });
    if (!c.causal.length) rs.forEach(r => set.add(c.prox + '>' + r));
  });
  return set;
}
function linkText(k) { const [a, b] = k.split('>'); return `${esc(FINDINGS.find(f => f.id === a).text)} <strong>&#8594;</strong> ${esc(FINDINGS.find(f => f.id === b).text)}`; }
function diffHTML() {
  const mine = linkSet(S.chains), team = linkSet(TEAM_CHAINS);
  const missing = [...team].filter(k => !mine.has(k));
  const missingSeen = missing.filter(k => k.split('>').every(i => anyGathered(FINDINGS.find(f => f.id === i).needs)));
  const missingUnseen = missing.filter(k => !missingSeen.includes(k));
  const extra = [...mine].filter(k => !team.has(k));
  const onMine = new Set(Object.keys(S.tags).filter(k => S.tags[k].type !== 'non'));
  const teamCause = new Set(); TEAM_CHAINS.forEach(c => { teamCause.add(c.prox); c.causal.forEach(i => teamCause.add(i)); rootsOf(c).forEach(i => teamCause.add(i)); });
  const notOnMine = [...teamCause].filter(i => !onMine.has(i) && anyGathered(FINDINGS.find(f => f.id === i).needs));
  const lockedTeam = [...teamCause].filter(i => !anyGathered(FINDINGS.find(f => f.id === i).needs));
  const ul = arr => `<ul style="margin:6px 0 10px;padding-left:20px;">${arr.map(x => `<li>${x}</li>`).join('')}</ul>`;
  let h = '';

  if (notOnMine.length) h += `<p><strong>Findings the review team placed in the chain that are not in yours (you had the sources):</strong></p>${ul(notOnMine.map(i => `${esc(FINDINGS.find(f => f.id === i).text)} (the review team: ${typeObj(FINDINGS.find(f => f.id === i).type).label.toLowerCase()})`))}`;
  if (lockedTeam.length) h += `<p><strong>Findings that need sources you have not gathered yet:</strong></p>${ul(lockedTeam.map(i => { const f = FINDINGS.find(x => x.id === i); return `${esc(f.text)} (${esc(f.needs.map(srcName).join('; '))})`; }))}`;

  if (missingUnseen.length) h += `<p><strong>Links that depend on findings you have not reached:</strong></p>${ul(missingUnseen.map(linkText))}`;
  if (extra.length) h += `<p><strong>Links on your diagram that the review team did not draw:</strong></p>${ul(extra.map(linkText))}<p class="small">That is one way to view this. Let's explore whether each link holds: if the first condition were fixed, would the second become less likely?</p>`;
  return h;
}
function syncTags() {
  S.tags = {};
  S.chains.forEach(c => {
    S.tags[c.prox] = { type: 'prox', cat: S.cats[c.prox] || '' };
    c.causal.forEach(i => S.tags[i] = { type: 'causal', cat: S.cats[i] || '' });
    rootsOf(c).forEach(i => S.tags[i] = { type: 'root', cat: S.cats[i] || '' });
  });
  S.ctx.forEach(i => S.tags[i] = { type: 'non', cat: '' });
}
function unassigned() {
  return activeFindings().filter(f => !S.tags[f.id]).sort((a, b) => ((+a.id.slice(1)) * 7 % 15) - ((+b.id.slice(1)) * 7 % 15));
}
function pickNudge(phase, f) {
  if (phase === 'prox' && f.type !== 'prox') return 'Let\'s explore this choice. A proximate cause begins with the role of the person who did or did not act (for example, "The resident did not..."). Does this finding describe a person\'s action, or a condition in the work system?';
  if (phase === 'causal' && f.type === 'prox') return 'Have you thought about whether this finding names a person\'s action? A causal factor describes the condition that shaped what happened, not a person or a role.';
  if (phase === 'causal' && f.type === 'root') return 'That is one way to view this. Have you thought about whether this condition sits underneath the others, so that fixing it would keep the whole chain from recurring? If so, it may belong at the end of the chain as a root cause.';
  if (phase === 'root' && f.type === 'prox') return 'Have you thought about whether this finding names a person\'s action? A root cause describes a condition in the work system that leaders can change.';
  if (phase === 'root' && f.type === 'causal') return 'Let\'s explore this choice. Try asking "why?" once more about this condition. Would fixing it keep the chain from recurring, or does it stem from something deeper?';
  if ((phase === 'causal' || phase === 'root') && f.type === 'non') return 'Have you thought about whether this finding contributed to the event, or whether it describes background that did not shape what happened?';

}

    const rid = cur.root[cur.root.length - 1];
    const rules = S.rules[rid] = S.rules[rid] || [false, false, false, false, false];
    panel = `<h3>Check the root cause statement</h3><div class="box"><strong>Your root cause statement</strong><br>${esc(fobj(rid).text)}</div><p>Check this statement against the Five Rules of Causation (RCA2 Appendix 6). Mark each rule that the statement meets.</p><div class="picklist">${FIVE_RULES.map((r, i) => `<label class="pick"><input type="checkbox" data-rule="${i}" ${rules[i] ? 'checked' : ''}><span class="t" style="font-weight:400;">${i + 1}. ${r}</span></label>`).join('')}</div><div id="rulesNote"></div>`;
    primary = `<button class="btn" id="rulesGo">Continue</button>`;
  } else if (ph === 'rootnext') {
    const last = cur.root[cur.root.length - 1];
    let body = '';
    if (!tc) { body = '<p>Your chain does not match one of the review team\'s chains, so there is no count to share. You can add another root cause or finish this chain.</p>'; primary = `<button class="btn alt" id="nextRoot">Choose Another Root Cause</button><button class="btn" id="toMore">Finish This Chain</button>`; }
    else {
      const link = tc.root.includes(last) ? 'The review team also tied this root cause to this chain.' : 'The review team did not tie this finding to this chain as a root cause. Let\'s explore whether changing it would keep this chain from recurring. You can use Undo Last Step to take it off.';
      const rem = tc.root.filter(id => !cur.root.includes(id));
      const seen = rem.filter(id => anyGathered(fobj(id).needs));
      const mySfm = S.cats[last]; const ts = fobj(last).sfm || [];
      const sfmMsg = (mySfm && ts.length) ? (ts.includes(mySfm) ? ` The review team also classified it as ${sfmObj(ts[0]).label}.` : ` The review team classified it as ${ts.map(c => sfmObj(c).label).join(' or ')}. Let's explore what in the sources points to that mechanism.`) : '';
      body = `<p>${link}${sfmMsg}</p>`;
      if (!rem.length) { body += '<p><strong>There are no more root causes for this chain.</strong></p>'; primary = `<button class="btn" id="toMore">Finish This Chain</button>`; }
      else if (seen.length) { body += `<p><strong>There ${countWords(rem.length, 'root cause', 'root causes')} for this chain.</strong> What else sits underneath the conditions you found?${seen.length < rem.length ? ' Some need sources you have not gathered yet.' : ''}</p>`; primary = `<button class="btn" id="nextRoot">Choose the Next Root Cause</button>`; }
      else { body += '<p><strong>There is another root cause for this chain</strong>, but the sources you have gathered do not show it yet. You can gather more information now, or finish this chain and return later.</p>'; primary = `<button class="btn" id="toMore">Finish This Chain</button>`; }
    }
    panel = `<h3>Chain ${n}: Another root cause?</h3>${fb('Where this stands.', body)}`;
  } else if (ph === 'more') {
    const rem = TEAM_CHAINS.filter(t => !S.chains.some(c => c.prox === t.prox));
    const seen = rem.filter(t => anyGathered(fobj(t.prox).needs));
    let body = '<p>Read the chain from top to bottom: does each link lead to the next?</p>';
    if (seen.length) { body += `<p><strong>There ${countWords(rem.length, 'proximate cause', 'proximate causes')} to follow.</strong> Which other action (or inaction) close to the event do you want to follow back to its root cause?${seen.length < rem.length ? ' Some need sources you have not gathered yet.' : ''}</p>`; primary = `<button class="btn" id="newChain">Start Chain ${n + 1}</button>`; }
    else if (rem.length) { body += '<p><strong>There is another proximate cause to follow</strong>, but the sources you have gathered do not show it yet. You can gather more information now, or continue.</p>'; primary = `<button class="btn" id="toCtx">Continue</button>`; }
    else { body += '<p><strong>There are no more proximate causes to follow.</strong></p>'; primary = `<button class="btn" id="toCtx">Continue</button>`; }
    panel = `<h3>Chain ${n} is complete</h3>${fb('Where this stands.', body)}`;
  } else {
    panel = `<h3>Anything left over?</h3><p>These findings are not on your diagram yet. Mark any you consider context (background that did not shape what happened). Anything you leave unmarked stays off the diagram.</p><div class="picklist">${unassigned().map(f => `<label class="pick"><input type="checkbox" data-ctx="${f.id}" ${S.ctx.includes(f.id) ? 'checked' : ''}><span class="t" style="font-weight:400;">${esc(f.text)}</span></label>`).join('') || '<p class="small">Every available finding is already on your diagram.</p>'}</div>`;
    primary = `<button class="btn" id="chk">Test My Root Causes</button>`;
  }
  const canUndo = !(ph === 'prox' && n === 0);
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Step 5</span>
    <h2 class="title">Build the Cause and Effect Diagram</h2>
    <p>We will build this one link at a time. Start with one proximate cause, ask what led to it, follow it back to a root cause, and then decide whether another chain is needed.</p>
    <div class="box"><strong>How to tell the types apart</strong><ul>
      <li><strong>Proximate causes</strong> begin with the role of the person who did or did not act (for example, "The resident did not...").</li>
      <li><strong>Causal factors and root causes</strong> describe the condition or finding in the work system. They do not begin with a person or a role.</li></ul></div>
    ${panel}
    ${lockedCount() > 0 ? fb('Your sources may support more findings.', `Some possible findings are hidden because the sources that would support them have not been gathered. ${lockedCount()} finding${lockedCount() === 1 ? '' : 's'} remain locked. You can return to fact finding at any time.`) : ''}
    <h3 style="margin-top:22px;">Your diagram so far (read from top to bottom)</h3>
    <div id="fishPreview">${fishHTML()}</div>
    ${nav(`<button class="btn alt" id="more">Gather More Information</button>${canUndo ? '<button class="btn alt" id="undo">Undo Last Step</button>' : ''}${primary}`)}
  </div>`;
  const add = document.getElementById('add');
  app.querySelectorAll('input[name=bp]').forEach(r => r.onchange = () => {
    S.pick = r.value; if (add) add.disabled = !(S.pick && (ph !== 'root' || S.pickCat));
    const nd = pickNudge(ph, fobj(r.value));
    document.getElementById('nudge').innerHTML = nd ? fb('Something to consider.', esc(nd)) : '';
  });
  const catsel = document.getElementById('catsel');
  if (catsel) catsel.onchange = () => { S.pickCat = catsel.value; const hp = document.getElementById('sfmhelp'); if (hp) hp.innerHTML = sfmHelpHTML(S.pickCat); if (add) add.disabled = !(S.pick && (ph !== 'root' || S.pickCat)); };
  if (add) add.disabled = !(S.pick && (ph !== 'root' || S.pickCat));
  if (add) add.onclick = () => {
    if (!S.pick || (ph === 'root' && !S.pickCat)) return;
    if (ph === 'root') S.cats[S.pick] = S.pickCat;
    if (ph === 'prox') { S.chains.push({ prox: S.pick, causal: [], root: [] }); S.bphase = 'causal'; }
    else if (ph === 'causal') { cur.causal.push(S.pick); S.bphase = 'causalnext'; }
    else if (ph === 'root') { cur.root.push(S.pick); S.bphase = 'rules'; }
    S.pick = ''; S.pickCat = ''; syncTags(); renderFishbone(); window.scrollTo(0, 0);
  };
  const bind = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = () => { fn(); S.pick = ''; S.pickCat = ''; syncTags(); renderFishbone(); window.scrollTo(0, 0); }; };
  bind('moreCausal', () => { S.bphase = 'causal'; });
  bind('toRoot', () => { S.bphase = 'root'; });
  bind('nextRoot', () => { S.bphase = 'root'; });
  bind('toMore', () => { S.bphase = 'more'; });
  bind('newChain', () => { S.bphase = 'prox'; });
  bind('toCtx', () => { S.bphase = 'ctx'; });
  bind('undo', () => {
    if (ph === 'causal') { if (cur.causal.length) S.bphase = 'causalnext'; else { S.chains.pop(); S.bphase = S.chains.length ? 'more' : 'prox'; } }
    else if (ph === 'causalnext') { cur.causal.pop(); S.bphase = cur.causal.length ? 'causalnext' : 'causal'; }
    else if (ph === 'root') S.bphase = cur.root.length ? 'rootnext' : 'causalnext';
    else if (ph === 'rules') { cur.root.pop(); S.bphase = cur.root.length ? 'rootnext' : 'root'; }
    else if (ph === 'rootnext') { cur.root.pop(); S.bphase = cur.root.length ? 'rootnext' : 'root'; }
    else if (ph === 'more') S.bphase = 'rootnext';
    else if (ph === 'ctx') { S.ctx = []; S.bphase = 'more'; }
    else if (ph === 'prox') S.bphase = 'more';
  });
  if (ph === 'rules') {
    const rid = cur.root[cur.root.length - 1];
    app.querySelectorAll('[data-rule]').forEach(cb => cb.onchange = () => { S.rules[rid][+cb.dataset.rule] = cb.checked; });
    document.getElementById('rulesGo').onclick = () => {
      const unmarked = S.rules[rid].map((v, i) => v ? -1 : i).filter(i => i >= 0);
      const f = fobj(rid);
      let msg = '';
      if (unmarked.length && !S.rulesWarned[rid]) msg += `<p>Let's explore the rules you did not mark. Does this statement meet them?</p><ul style="margin:6px 0 0;padding-left:20px;">${unmarked.map(i => `<li>Rule ${i + 1}: ${esc(FIVE_RULES[i])}</li>`).join('')}</ul>`;
      if (f.type !== 'root' && !S.rulesWarned[rid]) msg += `<p>The review team tagged this finding as ${typeObj(f.type).label.toLowerCase()}. Have you thought about whether it has a proven cause and effect relationship, is within leaders' control, and is a good use of resources to correct?</p>`;
      if (msg && !S.rulesWarned[rid]) { S.rulesWarned[rid] = true; document.getElementById('rulesNote').innerHTML = fb('Something to consider.', msg); document.getElementById('rulesGo').textContent = 'Continue Anyway'; return; }
      S.bphase = 'rootnext'; renderFishbone(); window.scrollTo(0, 0);
    };
  }
  app.querySelectorAll('[data-ctx]').forEach(cb => cb.onchange = () => {
    S.ctx = Array.from(app.querySelectorAll('[data-ctx]:checked')).map(x => x.dataset.ctx); syncTags();
    document.getElementById('fishPreview').innerHTML = fishHTML();
  });
  document.getElementById('more').onclick = () => { S.returnTo = 'fishbone'; go('gather2'); };
  const chk = document.getElementById('chk'); if (chk) chk.onclick = () => go('check');
}

// ---------------------------------------------------------------------
// STEP: ROOT CAUSE CHECK AND CAUSAL STATEMENTS
// ---------------------------------------------------------------------
function renderCheck() {
  const act = activeFindings();
  const roots = FINDINGS.filter(f => f.type === 'root');
  const rows = act.map(f => {
    const mine = S.tags[f.id] || {};
    const same = mine.type === f.type;
    const tip = (!same && (mine.type === 'prox' || f.type === 'prox')) ? ' Tip: a proximate cause begins with the role of the person who did or did not act, and a causal factor or root cause describes the condition.' : '';
    const mc = f.type === 'root' ? S.cats[f.id] : '';
    const teamSfm = (f.sfm || []).map(c => sfmObj(c).label).join(' or ');
    const catNote = (mc && f.sfm && !f.sfm.includes(mc)) ? ` The review team classified this root cause as ${teamSfm}. Let's explore what in the sources points to that category.` : '';
    const note = (same ? 'Your tag matches the review team\'s tag.' : `The review team tagged this as ${typeObj(f.type).label.toLowerCase()}. ${f.why}${tip}`) + catNote;
    return `<tr><td>${esc(f.text)}</td><td><span class="chip ${mine.type || 'none'}">${mine.type ? typeObj(mine.type).short : 'None'}</span></td><td><span class="chip ${f.type}">${typeObj(f.type).short}</span></td><td>${f.type === 'root' ? `${mc ? sfmObj(mc).label : 'None chosen'}<br><span class="small">Review team: ${teamSfm}</span>` : ''}</td><td>${esc(note)}</td></tr>`;
  }).join('');
  const found = roots.filter(f => anyGathered(f.needs) && S.tags[f.id] && S.tags[f.id].type === 'root');
  const unseen = roots.filter(f => !anyGathered(f.needs));
  const mistagged = act.filter(f => S.tags[f.id] && S.tags[f.id].type === 'root' && f.type !== 'root');
  const missedTagged = roots.filter(f => anyGathered(f.needs) && !(S.tags[f.id] && S.tags[f.id].type === 'root'));
  let summary = `<p>You tagged <strong>${found.length} of the ${roots.length}</strong> root causes that the review team identified.</p><ul style="margin:6px 0 0;padding-left:20px;">`;
  if (found.length === roots.length) summary += '<li>You reached every root cause the review team identified.</li>';
  missedTagged.forEach(f => summary += `<li>You had the evidence for this one but tagged it differently: ${esc(f.text)}</li>`);
  unseen.forEach(f => summary += `<li>This root cause was not supported by the sources you gathered: ${esc(f.text)} It would have appeared with: ${esc(f.needs.map(srcName).join('; '))}.</li>`);
  mistagged.forEach(f => summary += `<li>You tagged this as a root cause, and the review team tagged it as ${typeObj(f.type).label.toLowerCase()}: ${esc(f.text)}</li>`);
  summary += '</ul>';
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Step 5</span>
    <h2 class="title">Did You Reach the Root Causes?</h2>
    ${fb('How your root causes compare.', summary, true)}
    <h3 style="margin-top:22px;">Your Diagram and the Review Team's Diagram</h3>
    <div class="cmp-grid">
      <div><h4>Your diagram</h4>${fishHTML()}</div>
      <div><h4>The review team's diagram</h4>${fishHTML(TEAM_CHAINS, TEAM_CTX, true)}</div>
    </div>
    ${fb('Where the two diagrams differ.', diffHTML())}
    <h3 style="margin-top:22px;">Your Root Causes by System Failure Mechanism</h3>
    ${catGridHTML()}
    <h3 style="margin-top:22px;">Finding by Finding</h3>
    <div class="tbl-scroll"><table><tr><th>Finding</th><th>Your tag</th><th>Review team</th><th>SFM (root causes)</th><th>Notes</th></tr>${rows}</table></div>
    ${nav(`<button class="btn alt" id="more">Gather More Information</button><button class="btn" id="toAct">Continue to Actions</button>`)}
  </div>`;
  const toAct = document.getElementById('toAct'); if (toAct) toAct.onclick = () => go('actions');
  document.getElementById('more').onclick = () => { S.returnTo = 'fishbone'; go('gather2'); };
}

// ---------------------------------------------------------------------
// STEP: ACTIONS
// ---------------------------------------------------------------------
function newAction() {
  S.actionSeq++;
  return { id: 'ac' + S.actionSeq, text: '', rc: '', cat: '', owner: '', due: '', measure: '', sm: {} };
}
function studentRoots() { return FINDINGS.filter(f => anyGathered(f.needs) && S.tags[f.id] && S.tags[f.id].type === 'root'); }
function actionNotes(a) {
  const n = [];
  const st = strengthOf(a.cat);
  if (a.text.trim().length < 30) n.push('Have you thought about describing what will change, where, and who will carry it out?');
  if (!a.cat) n.push('Choose a category from the Action Hierarchy so the strength of this action can be ranked.');
  else if (st === 'Weaker') n.push('This action falls in the weaker group. Weaker actions such as training and policy changes are often necessary to set expectations, but used alone they rarely sustain improvement. Is there a stronger or intermediate action alongside it?');
  if (!a.owner.trim()) n.push('RCA2 suggests naming one responsible individual with the authority to act.');
  else if (/committee|team\b|everyone|all staff|nursing$|leadership$/i.test(a.owner)) n.push('A committee or group is harder to hold to a date. Have you thought about naming a single role?');
  if (!a.due) n.push('Choose a due date so the action can be tracked.');
  if (!/\d/.test(a.measure)) n.push('A measure needs an expected level of compliance, such as a percentage or a count.');
  if (!/(day|week|month|quarter|year)/i.test(a.measure)) n.push('Add how long the measure will be tracked, for example monthly for six months.');
  if (!a.rc) n.push('Link this action to a root cause so its relevance is clear.');
  // SMARTIES self-check consistency
  const sm = a.sm;
  if (sm.M && (!/\d/.test(a.measure) || !/(day|week|month|quarter|year)/i.test(a.measure))) n.push('You marked Measurable, and the measure still lacks a number or a time period.');
  if (sm.T && !a.due) n.push('You marked Timely, and no due date is chosen.');
  if (sm.R && !a.rc) n.push('You marked Relevant, and no root cause is linked.');
  if (sm.S && (a.text.trim().length < 30 || !a.owner.trim())) n.push('You marked Specific, and the action text or the owner could say more.');
  SMARTIES.filter(x => ['A', 'I', 'E', 'Sf'].indexOf(x.k) >= 0 && !sm[x.k]).forEach(x => n.push(`${x.name}: ${x.q}`));
  return n;
}
function renderActions() {
  if (S.actions.length === 0) S.actions.push(newAction());
  const roots = studentRoots();
  const rcList = a => `<label class="fl">Root cause it addresses (choose one)</label><div class="picklist" role="radiogroup">${roots.map(r => `<label class="pick"><input type="radio" name="${a.id}_rcr" id="${a.id}_rc_${r.id}" value="${r.id}" data-af="rc" ${a.rc === r.id ? 'checked' : ''}><span class="t" style="font-weight:400;">${esc(r.text)}</span></label>`).join('')}<label class="pick"><input type="radio" name="${a.id}_rcr" id="${a.id}_rc_other" value="other" data-af="rc" ${a.rc === 'other' ? 'checked' : ''}><span class="t" style="font-weight:400;">A cause I did not tag as a root cause</span></label></div>`;
  const catOpts = `<option value="">Choose a category</option>` + HIERARCHY.map(g => `<optgroup label="${g.group}">${g.cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</optgroup>`).join('');
  const dueOpts = `<option value="">Choose a due date</option>` + DUE_OPTIONS.map(d => `<option value="${d}">${d} after approval</option>`).join('');
  const sel = (html, val) => html.replace(`value="${esc(val)}"`, `value="${esc(val)}" selected`);
  const cards = S.actions.map((a, i) => `
    <div class="acard" data-a="${a.id}">
      ${S.actions.length > 1 ? `<button class="rm" data-rm="${a.id}" aria-label="Remove action ${i + 1}">Remove</button>` : ''}
      <h4 style="margin:0 0 4px;">Action ${i + 1} ${a.cat ? `<span class="chip ${strengthOf(a.cat) === 'Stronger' ? 'root' : strengthOf(a.cat) === 'Intermediate' ? 'causal' : 'non'}">${strengthOf(a.cat)}</span>` : ''}</h4>
      <label class="fl" for="${a.id}_t">What will change, where, and who will carry it out?</label>
      <textarea id="${a.id}_t" data-af="text">${esc(a.text)}</textarea>
      ${rcList(a)}
      <div class="grid2">
        <div><label class="fl" for="${a.id}_c">Action Hierarchy category</label><select id="${a.id}_c" data-af="cat">${sel(catOpts, a.cat)}</select></div>
        <div><label class="fl" for="${a.id}_o">Responsible person (a role)</label><input type="text" id="${a.id}_o" data-af="owner" value="${esc(a.owner)}"></div>
        <div><label class="fl" for="${a.id}_d">Due date</label><select id="${a.id}_d" data-af="due">${sel(dueOpts, a.due)}</select></div>
      </div>
      <label class="fl" for="${a.id}_m">Measure: what, for how long, and the expected compliance</label>
      <textarea id="${a.id}_m" data-af="measure">${esc(a.measure)}</textarea>
      <label class="fl">SMART(IES) self-check: mark each letter you believe this action meets</label>
      <div class="smart">${SMARTIES.map(x => `<label title="${esc(x.q)}"><input type="checkbox" data-sm="${x.k}" ${a.sm[x.k] ? 'checked' : ''}> ${x.name}</label>`).join('')}</div>
    </div>`).join('');
  let result = '';
  if (S.actionsChecked) {
    const blocks = S.actions.map((a, i) => {
      const n = actionNotes(a);
      return `<li><strong>Action ${i + 1}${a.cat ? ' (' + strengthOf(a.cat) + ')' : ''}:</strong> ${n.length ? `<ul style="margin:4px 0 8px;padding-left:20px;">${n.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : 'Your entries meet each of the checks in this tool.'}</li>`;
    }).join('');
    const cov = roots.map(r => {
      const linked = S.actions.filter(a => a.rc === r.id && ['Stronger', 'Intermediate'].indexOf(strengthOf(a.cat)) >= 0);
      return linked.length ? '' : `<li>No stronger or intermediate action is linked to this root cause: ${esc(r.text)}</li>`;
    }).join('');
    result = fb('How your action plan reads.', `<ul style="margin:6px 0 0;padding-left:20px;">${blocks}</ul>${cov ? `<p style="margin:8px 0 0;"><strong>Coverage:</strong> RCA2 recommends at least one stronger or intermediate action for each root cause.</p><ul style="padding-left:20px;margin:4px 0 0;">${cov}</ul>` : (roots.length ? '<p style="margin:8px 0 0;"><strong>Coverage:</strong> every root cause you tagged has at least one stronger or intermediate action.</p>' : '<p style="margin:8px 0 0;">Tag root causes on the diagram so each action can be linked to one.</p>')}`, true);
    result += `<h3 style="margin-top:22px;">The Review Team's Action Plan</h3><p class="small">Your plan does not need to match this one. Compare the strength of the actions, the owners, and the measures.</p>
      <div class="tbl-scroll"><table><tr><th>Root cause</th><th>Action</th><th>Strength</th><th>Owner and due</th><th>Measure</th></tr>${TEAM_ACTIONS.map(t => `<tr><td>${esc(t.rc)}</td><td>${esc(t.action)}</td><td>${t.strength}<br><span class="small">${esc(t.cat)}</span></td><td>${esc(t.owner)}<br><span class="small">${t.due} after approval</span></td><td>${esc(t.measure)}</td></tr>`).join('')}</table></div>
      <div class="box"><strong>Also in the review team's plan.</strong> Weaker supporting actions: update the escalation policy to the new time-based rule and educate staff on it, which sets expectations but does not sustain change alone. ${esc(IMMEDIATE_ACTIONS)}</div>`;
  }
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Step 6</span>
    <h2 class="title">Write the Actions and Check Them</h2>
    <p>For each root cause, write an action that would prevent recurrence or reduce its effect. Rank each action with the RCA2 Action Hierarchy and check it against the SMART(IES) criteria: <strong>S</strong>pecific, <strong>M</strong>easurable, <strong>A</strong>ttainable, <strong>R</strong>elevant, <strong>T</strong>imely, <strong>I</strong>nclusive, <strong>E</strong>quitable, and <strong>S</strong>afe.</p>
    <div class="box"><strong>The Action Hierarchy (RCA2)</strong><ul>${HIERARCHY.map(g => `<li><strong>${g.group}:</strong> ${g.cats.join('; ')}.</li>`).join('')}</ul></div>
    <div id="acards">${cards}</div>
    ${nav(`<button class="btn alt" id="add" ${S.actions.length >= 6 ? 'disabled' : ''}>Add Another Action</button><button class="btn dark" id="chk">Check My Plan</button>`)}
    <div id="aresult">${result}</div>
    ${S.actionsChecked ? nav(`<button class="btn" id="toSum">Continue to the Summary</button>`) : ''}
  </div>`;
  app.querySelectorAll('.acard').forEach(card => {
    const a = S.actions.find(x => x.id === card.dataset.a);
    card.querySelectorAll('[data-af]').forEach(el => {
      const upd = () => {
        a[el.dataset.af] = el.value;
        if (el.dataset.af === 'cat') {
          const chip = card.querySelector('h4'); const s = strengthOf(a.cat);
          chip.innerHTML = `Action ${S.actions.indexOf(a) + 1} ` + (a.cat ? `<span class="chip ${s === 'Stronger' ? 'root' : s === 'Intermediate' ? 'causal' : 'non'}">${s}</span>` : '');
        }
      };
      el.oninput = upd; el.onchange = upd;
    });
    card.querySelectorAll('[data-sm]').forEach(cb => cb.onchange = () => { a.sm[cb.dataset.sm] = cb.checked; });
  });
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { S.actions = S.actions.filter(x => x.id !== b.dataset.rm); S.actionsChecked = false; renderActions(); });
  document.getElementById('add').onclick = () => { S.actions.push(newAction()); S.actionsChecked = false; renderActions(); };
  document.getElementById('chk').onclick = () => { S.actionsChecked = true; const y = window.scrollY; renderActions(); window.scrollTo(0, y); setTimeout(() => { const r = document.getElementById('aresult'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); };
  const toSum = document.getElementById('toSum'); if (toSum) toSum.onclick = () => go('summary');
}

// STEP: SUMMARY
// ---------------------------------------------------------------------
function elapsed() { const s = Math.round((Date.now() - S.start) / 1000); return Math.floor(s / 60) + ' min ' + (s % 60) + ' sec'; }
function renderSummary() {
  const roots = FINDINGS.filter(f => f.type === 'root');
  const found = roots.filter(f => anyGathered(f.needs) && S.tags[f.id] && S.tags[f.id].type === 'root').length;
  const recNames = RECORDS.filter(r => S.rec.has(r.id)).map(r => r.title);
  const intNames = INTERVIEWS.filter(i => S.int.has(i.id)).map(i => i.role);
  const levelLabel = S.level === 'ACA' ? 'ACA (completed), compared with a full analysis' : (S.triedACA ? 'ACA explored, then RCA' : 'RCA');
  const actionRows = S.actions.filter(a => a.text.trim()).map((a, i) => {
    const smChecked = SMARTIES.filter(x => a.sm[x.k]).map(x => x.name).join(', ') || 'None marked';
    return `<tr><td>${i + 1}. ${esc(a.text)}</td><td>${a.cat ? strengthOf(a.cat) + '<br><span class="small">' + esc(a.cat) + '</span>' : ''}</td><td>${esc(a.owner)}<br><span class="small">${esc(a.due)}</span></td><td>${esc(a.measure)}</td><td class="small">${esc(smChecked)}</td></tr>`;
  }).join('');
  app.innerHTML = `
  <div class="card">
    <span class="step-label">Case ${CASE.num} Complete</span>
    <h2 class="title">Comprehensive Safety Analysis Summary</h2>
    <div class="nameline noprint"><label for="nm"><strong>Your name (for the printed summary):</strong></label><input type="text" id="nm" value="${esc(S.name)}"></div>
    <p class="printonly"><strong>Student:</strong> <span id="nmPrint">${esc(S.name)}</span></p>
    <p class="small">HCA 880: Patient Safety and Risk &middot; Case ${CASE.num}: ${CASE.title} &middot; Time on task: ${elapsed()} &middot; ${new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
    <table>
      <tr><th style="width:30%">Step</th><th>Your work</th></tr>
      <tr><td>SAC score</td><td>${SAC[S.prob][S.sev]} (${SEVERITY.find(s => s.key === S.sev).label} severity, ${PROBABILITY.find(p => p.key === S.prob).label} probability)</td></tr>
      <tr><td>Level of analysis</td><td>${levelLabel}</td></tr>
      <tr><td>Chart review</td><td>${recNames.length ? esc(recNames.join('; ')) : 'None'}</td></tr>
      <tr><td>Interviews</td><td>${intNames.length ? esc(intNames.join('; ')) : 'None'}</td></tr>
      <tr><td>Root causes</td><td>${found} of ${roots.length} root causes identified by the review team were tagged by you</td></tr>
    </table>
    <h3 style="margin-top:22px;">Timeline from Your Fact Finding</h3>${timelineHTML()}
    ${activeFindings().some(f => S.tags[f.id] && S.tags[f.id].type) ? `<h3 style="margin-top:22px;">Your Cause and Effect Diagram (read from top to bottom)</h3>${fishHTML()}` : ''}
    ${S.aca.occ.trim() ? `<h3 style="margin-top:22px;">Your ACA Report</h3><table>${ACA_FIELDS.map(f => `<tr><td style="width:30%">${esc(f.label)}</td><td>${esc(S.aca[f.id])}</td></tr>`).join('')}</table>${S.aca.gaps.some(g => g.gap.trim()) ? `<table><tr><th>Gap #</th><th>Gap</th><th>Action</th><th>Owner</th><th>Due</th></tr>${S.aca.gaps.map((g, i) => g.gap.trim() ? `<tr><td class="num">${i + 1}</td><td>${esc(g.gap)}</td><td>${esc(g.action)}</td><td>${esc(g.owner)}</td><td>${esc(g.due)}</td></tr>` : '').join('')}</table>` : ''}` : ''}
    ${actionRows ? `<h3 style="margin-top:22px;">Your Action Plan</h3><div class="tbl-scroll"><table><tr><th>Action</th><th>Strength</th><th>Owner and due</th><th>Measure</th><th>SMART(IES) marked</th></tr>${actionRows}</table></div>` : ''}
    ${fb('A note on the people involved.', 'The resident and the nurse in this event will likely experience what researchers call second victim syndrome: guilt, self-doubt, and distress after an event on their watch. They came to work to provide safe care, and they made decisions inside a culture that narrowed their options. A strong organizational response includes attending to their wellbeing, in addition to analyzing the system. A just culture and psychological safety are preventive measures, and they are also part of how an organization cares for its people after harm occurs.')}
    ${nav(`<button class="btn dark" id="print">Print or Save as PDF</button><button class="btn alt" id="restart">Start Over</button>`)}
    <p class="small noprint" style="text-align:right;">In the print dialog, choose "Save as PDF" to create the file you will submit to your instructor.</p>
  </div>`;
  const nm = document.getElementById('nm');
  nm.oninput = () => { S.name = nm.value; document.getElementById('nmPrint').textContent = nm.value; };
  document.getElementById('print').onclick = () => window.print();
  document.getElementById('restart').onclick = () => { if (confirm('Start over? Your work in this session will be cleared.')) location.reload(); };
  try { if (window.parent !== window) window.parent.postMessage({ type: 'csa-complete', caseNum: CASE.num }, '*'); } catch (e) {}
}

// ---------------------------------------------------------------------
// ROUTER
// ---------------------------------------------------------------------
function render() {
  const s = S.step;
  if (s === 'intro') renderIntro();
  else if (s === 'harm') renderHarm();
  else if (s === 'level') renderLevel();
  else if (s === 'gather') renderGather(1);
  else if (s === 'gather2') renderGather(2);
  else if (s === 'timeline') renderTimeline();
  else if (s === 'aca') renderACA();
  else if (s === 'fishbone') renderFishbone();
  else if (s === 'check') renderCheck();
  else if (s === 'actions') renderActions();
  else if (s === 'summary') renderSummary();
}
renderStepper();
render();
</script>
</body>
</html>
